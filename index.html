<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>CONTEXT v2 — Світ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e14; color:#dfe6f2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; }
  #top { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:6px;
    padding:6px 8px; background:rgba(11,14,20,.85); backdrop-filter:blur(6px); z-index:10; flex-wrap:wrap; }
  #tname { font-size:12px; font-weight:700; letter-spacing:1.5px; color:#4cc9f0; white-space:nowrap; }
  #tseed { font-size:11px; color:#6b7c99; margin-left:4px; white-space:nowrap; }
  .btn { min-width:38px; height:38px; padding:0 9px; border-radius:10px; border:1px solid #2c3a55;
    background:#141b2a; color:#b9c6dd; font-size:14px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .btn:active { background:#223049; }
  .btn.on { border-color:#4cc9f0; color:#4cc9f0; background:#0f2433; }
  .btn.pause { border-color:#fca311; color:#fca311; }
  #log { position:fixed; left:8px; bottom:8px; z-index:9; width:min(360px, 96vw);
    display:flex; flex-direction:column; gap:3px; pointer-events:none; }
  .lge { background:rgba(18,23,34,.8); border-left:3px solid #4cc9f0; border-radius:6px;
    padding:4px 8px; font-size:11px; color:#c7d3e8; animation:lin .25s ease; }
  .lge b { color:#6ee7a0; font-weight:600; }
  @keyframes lin { from { opacity:0; transform:translateX(-8px);} to {opacity:1;} }
  #types { position:fixed; right:8px; bottom:8px; z-index:9; width:min(300px, 94vw); max-height:44vh;
    background:rgba(13,17,26,.92); border:1px solid #223049; border-radius:12px; padding:8px;
    overflow-y:auto; display:none; }
  #types.open { display:block; }
  #types h3 { font-size:11px; color:#fca311; margin-bottom:6px; letter-spacing:1px; }
  .tcard { border:1px solid #223049; border-radius:10px; padding:6px 8px; margin-bottom:6px; background:#10141f; }
  .tcard .th { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .tcard .tic { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .tcard .tn { font-size:12.5px; font-weight:700; }
  .tcard .tp { font-size:10.5px; color:#8fa0bd; line-height:1.45; }
  #tip { position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:9; background:rgba(18,23,34,.85);
    border:1px solid #2c3a55; border-radius:12px; padding:6px 14px; font-size:12px; color:#9fb0cc; pointer-events:none;
    max-width:92%; text-align:center; }
  #hint { position:fixed; left:50%; bottom:52px; transform:translateX(-50%); z-index:9; display:none;
    background:rgba(252,163,17,.12); border:1px solid #fca311; color:#ffd9a0; border-radius:12px;
    padding:8px 14px; font-size:12.5px; max-width:min(520px, 92vw); text-align:center; pointer-events:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div id="tname">CONTEXT<span style="color:#6b7c99"> v2 · Світ</span></div>
  <div id="tseed"></div>
  <div style="flex:1"></div>
  <div style="display:flex;gap:6px">
    <button class="btn" id="bPlay" title="пуск">▶</button>
    <button class="btn" id="bSlow" title="сповільнено">🐌</button>
    <button class="btn" id="bPause" title="пауза">⏸</button>
    <button class="btn" id="bFields" title="поля">◉</button>
    <button class="btn" id="bForces" title="сили">⇶</button>
    <button class="btn" id="bDrops" title="ресурси">◆</button>
    <button class="btn" id="bTypes" title="типи">☰</button>
    <button class="btn" id="bNew" title="новий світ">⟳</button>
  </div>
</div>
<div id="tip">Світ живе сам. Тягни елемент на інший і відпусти — з'єднаються в тіло. Двома пальцями — масштаб. ⟳ — новий світ.</div>
<div id="log"></div>
<div id="types"></div>
<div id="hint"></div>

<script>
'use strict';
/* ============================================================
   CONTEXT v2 — процедурний світ-середовище (демо генерації)
   Кожен запуск: новий seed → нові типи елементів, нові зв'язки.
   Елемент = випадковий набір властивостей + форма + вигляд.
   Взаємодія = збіг типів. Світ живе без гравця.
   ============================================================ */

// ---------------- RNG / імена ----------------
function rng(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SYL = ['ко','ра','ве','ки','мі','ша','ду','на','тор','глі','фо','зей','лу','пі','ар','ен','ква','ро','са','ти'];
function genName(r) {
  const s = ()=>SYL[(r()*SYL.length)|0];
  return s().replace(/^./, c=>c.toUpperCase()) + s() + '-' + (1 + ((r()*97)|0));
}
const PALETTE = ['#4cc9f0','#fca311','#b388ff','#6ee7a0','#ef476f','#ffd60a','#80ed99','#ff8fa3','#74c0fc','#c0eb75','#ffa94d','#9775fa'];
const SHAPES = ['circle','ring','tri','square','star','blob','rod','diamond'];
const FCOL = ['#4cc9f0','#fca311','#b388ff','#6ee7a0'];
const RNAME = ['◆','●','▲'];

// ---------------- стан ----------------
let W = null;            // світ
let cam = { x:0, y:0, z:1 };
let dragEl = null, dragDX = 0, dragDY = 0, panPtr = null, pinch = null;
let logTimer = 0;

// ---------------- генерація типу ----------------
function genType(r, id) {
  const t = {
    id, name: genName(r),
    color: PALETTE[(r()*PALETTE.length)|0],
    shape: SHAPES[(r()*SHAPES.length)|0],
    props: [],
    mass: 1 + r()*1.6,
    baseR: 22 + r()*22,
  };
  // 1) поле-емітер АБО реагує на поле (гарантуємо зв'язки на рівні світу)
  // 2) ресурси, маса, контакт — випадково
  const n = 2 + ((r()*3)|0);   // 2-4 властивості
  for (let i=0;i<n;i++) {
    const pick = (r()*11)|0;
    switch (pick) {
      case 0: case 1: t.props.push({k:'emit_field', f:(r()*4)|0}); break;
      case 2: case 3: t.props.push({k:'react_field', f:(r()*4)|0, eff:['repel','attract','charge','grow'][(r()*4)|0]}); break;
      case 4: t.props.push({k:'emit_drop', res:(r()*3)|0}); break;
      case 5: t.props.push({k:'absorb_drop', res:(r()*3)|0, eff:['charge','grow'][(r()*2)|0]}); break;
      case 6: t.props.push({k:'burst', thr:50 + (r()*60)|0}); break;
      case 7: t.props.push({k:'heavy'}); break;
      case 8: t.props.push({k:'light'}); break;
      case 9: t.props.push({k:'contact'}); break;
      case 10: t.props.push({k:'link'}); break;
    }
  }
  // важкий/легкий регулюють масу (не можуть бути одночасно)
  const hasHeavy = t.props.some(p=>p.k==='heavy'), hasLight = t.props.some(p=>p.k==='light');
  if (hasHeavy && hasLight) t.props = t.props.filter(p => p.k !== 'light');
  if (hasHeavy) t.mass *= 3.2;
  if (hasLight) t.mass *= 0.35;
  return t;
}

// ---------------- генерація світу ----------------
function worldDims() {
  // під орієнтацію екрана: портрет → вертикальний світ
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  return portrait ? { W:520, H:880 } : { W:1100, H:700 };
}
function fitZoom() {
  const d = worldDims();
  return Math.min(window.innerWidth/d.W, window.innerHeight/d.H) * 0.92;
}
function newWorld(seed) {
  const r = rng(seed || ((Math.random()*1e9)|0));
  const d = worldDims();
  const w = {
    seed, W:d.W, H:d.H, types:[], els:[], drops:[], shocks:[], parts:[], links:[], events:[],
    t:0, mode:'play', layers:{fields:false, forces:false, drops:false},
  };
  // типи: 9-12
  const nTypes = 9 + ((r()*4)|0);
  for (let i=0;i<nTypes;i++) w.types.push(genType(r, i));
  // гарантія зв'язків: підбираємо хоча б 2 пари (емітер поля → реактор)
  ensurePairs(w, r);
  // екземпляри
  const nInst = (d.W < 700 ? 38 : 46) + ((r()*14)|0);
  for (let i=0;i<nInst;i++) {
    const ty = w.types[(r()*w.types.length)|0];
    w.els.push({
      id:i, ty, x: 60 + r()*(w.W-120), y: 70 + r()*(w.H-140),
      vx:(r()-0.5)*30, vy:(r()-0.5)*30, r: ty.baseR*(0.8 + r()*0.5), mass:ty.mass,
      energy:0, cd:r()*3, hitCd:0, bonds:[],
    });
  }
  W = w;
  try { window.__W = w; } catch(e) {}
  cam = { x:0, y:0, z: fitZoom() };
  try { window.__cam = cam; } catch(e) {}
  buildTypesPanel();
  return w;
}
function ensurePairs(w, r) {
  // знайти емітерів полів; якщо нема жодного реактора на їхні поля — додати
  const emitted = new Set();
  for (const t of w.types) for (const p of t.props) if (p.k==='emit_field') emitted.add(p.f);
  if (emitted.size === 0) { // дати одному типу емітер
    w.types[0].props.push({k:'emit_field', f:(r()*4)|0});
    emitted.add(w.types[0].props.find(p=>p.k==='emit_field').f);
  }
  for (const f of emitted) {
    const hasReactor = w.types.some(t => t.props.some(p => p.k==='react_field' && p.f===f));
    if (!hasReactor) {
      const t = w.types[(r()*w.types.length)|0];
      t.props.push({k:'react_field', f, eff:['repel','attract','charge','grow'][(r()*4)|0]});
    }
  }
  // гарантія: хоча б один бурст, якщо є charge
  if (w.types.some(t=>t.props.some(p=>p.k==='react_field' && p.eff==='charge')) &&
      !w.types.some(t=>t.props.some(p=>p.k==='burst'))) {
    w.types[(r()*w.types.length)|0].props.push({k:'burst', thr:60});
  }
}

// ---------------- опис властивостей (для панелі) ----------------
function propText(p) {
  switch (p.k) {
    case 'emit_field':  return 'Випромінює поле №' + p.f;
    case 'react_field': {
      const e = {repel:'Відштовхується від', attract:'Притягується до', charge:'Заряджається у', grow:'Росте у'}[p.eff];
      return e + ' поля №' + p.f;
    }
    case 'emit_drop':   return 'Випромінює ресурс ' + RNAME[p.res];
    case 'absorb_drop': return 'Поглинає ' + RNAME[p.res] + ' → ' + (p.eff==='charge'?'заряд':'ріст');
    case 'burst':       return 'Заряд >' + p.thr + ' → ВИБУХ';
    case 'heavy':       return 'Важкий (важко зсунути)';
    case 'light':       return 'Легкий (легко зсунути)';
    case 'contact':     return 'Передає імпульс при зіткненні';
    case 'link':        return 'Злипається при дотику';
  }
  return p.k;
}
function buildTypesPanel() {
  const el = document.getElementById('types');
  let h = '<h3>ТИПИ СВІТУ · ' + W.types.length + '</h3>';
  for (const t of W.types) {
    h += '<div class="tcard"><div class="th"><div class="tic" style="background:' + t.color + '33;color:' + t.color + '">' + shapeIcon(t) + '</div>' +
         '<div class="tn" style="color:' + t.color + '">' + t.name + '</div></div>' +
         '<div class="tp">' + t.props.map(propText).join(' · ') + '</div></div>';
  }
  el.innerHTML = h;
}
function shapeIcon(t) {
  switch (t.shape) {
    case 'circle': return '●';
    case 'ring': return '◌';
    case 'tri': return '▲';
    case 'square': return '■';
    case 'star': return '★';
    case 'blob': return '◍';
    case 'rod': return '▬';
    case 'diamond': return '◆';
  }
  return '●';
}

// ---------------- події ----------------
function event(text) {
  W.events.unshift({ text, t:9 });
  if (W.events.length > 7) W.events.pop();
}
function evThrottle(key, text, dt) {
  const k = W._ev || (W._ev = {});
  k[key] = (k[key]||0) - dt;
  if (k[key] <= 0) { event(text); k[key] = 2.2; }
}
function link(x1,y1,x2,y2,label) {
  W.links.push({ x1,y1,x2,y2,label,t:1.8 });
  if (W.links.length > 10) W.links.shift();
}
function shock(x,y,r) { W.shocks.push({ x,y, r:0, max:r, t:0.5 }); }
function spark(x,y,c,n) {
  for (let i=0;i<n;i++) W.parts.push({ x, y, vx:(Math.random()-0.5)*80, vy:(Math.random()-0.5)*80, t:0.6, c, r:2.5 });
}

// ---------------- фізика + взаємодії ----------------
const CFG = {
  FR: 0.9,            // тертя
  FIELD_R: 120,       // радіус поля
  FIELD_F: 1000,      // сила притяг/відштовх
  CHARGE_R: 26,       // швидкість заряду
  GROW_R: 3.2,
  BURST_R: 95,
  BURST_F: 320,
  DROP_CD: 3.2,
  DROP_LIFE: 4.5,
  DROP_ABSORB: 40,
  CONTACT_V: 60,
  EN_DECAY: 0.25,
  SNAP: 1.55,         // множник радіуса з'єднання (хто в межах — злипаються)
  BOND_BREAK_V: 300,  // швидкість удару, що рве зв'язок
  BOND_BREAK_STRETCH: 1.7, // розтяг, що рве зв'язок
};

function step(dt) {
  if (W.mode==='pause') return;
  if (W.mode==='slow') dt *= 0.3;
  W.t += dt;
  const els = W.els;

  // 1) поля: емітери → реактори
  for (const a of els) {
    for (const pa of a.ty.props) {
      if (pa.k !== 'emit_field') continue;
      for (const b of els) {
        if (b === a) continue;
        for (const pb of b.ty.props) {
          if (pb.k !== 'react_field' || pb.f !== pa.f) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d > CFG.FIELD_R) continue;
          const f = CFG.FIELD_F * (1 - d/CFG.FIELD_R) * dt;
          if (pb.eff === 'repel') { b.vx += dx/d*f; b.vy += dy/d*f; }
          else if (pb.eff === 'attract') { b.vx -= dx/d*f; b.vy -= dy/d*f; }
          else if (pb.eff === 'charge') {
            b.energy += CFG.CHARGE_R * dt;
            if ((b.energy|0) !== ((b.energy - CFG.CHARGE_R*dt)|0) && b.energy > 1) {
              evThrottle('ch'+b.id, b.ty.name + ' заряджається у полі №' + pa.f, 2.2);
            }
          }
          else if (pb.eff === 'grow') { b.r = Math.min(b.ty.baseR*1.9, b.r + CFG.GROW_R*dt); }
        }
      }
    }
  }

  // 2) накопичений заряд → вибух
  for (const b of els) {
    b.energy = Math.max(0, b.energy - CFG.EN_DECAY*dt);
    if (b.ty.props.some(p=>p.k==='burst') && b.energy >= b.ty.props.find(p=>p.k==='burst').thr) {
      burst(b);
    }
  }

  // 3) краплі ресурсів
  for (const e of els) {
    const em = e.ty.props.find(p=>p.k==='emit_drop');
    if (em) {
      e.cd -= dt;
      if (e.cd <= 0) {
        e.cd = CFG.DROP_CD * (0.6 + Math.random()*0.8);
        W.drops.push({ x:e.x, y:e.y, vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40, res:em.res, t:CFG.DROP_LIFE, r:4.5 });
      }
    }
  }
  for (let i=W.drops.length-1;i>=0;i--) {
    const d = W.drops[i];
    d.t -= dt;
    if (d.t <= 0) { W.drops.splice(i,1); continue; }
    d.vx *= Math.max(0, 1 - 0.5*dt);
    d.vy *= Math.max(0, 1 - 0.5*dt);
    d.x += d.vx*dt; d.y += d.vy*dt;
    clamp(d);
    let absorbed = false;
    for (const e of els) {
      const ap = e.ty.props.find(p=>p.k==='absorb_drop' && p.res===d.res);
      if (ap && Math.hypot(e.x-d.x, e.y-d.y) < CFG.DROP_ABSORB) {
        if (ap.eff==='charge') e.energy += 14;
        else e.r = Math.min(e.ty.baseR*1.9, e.r + 4);
        spark(e.x, e.y, FCOL[d.res], 6);
        evThrottle('ab'+e.id+d.res, e.ty.name + ' поглинув ' + RNAME[d.res] + ' → ' + (ap.eff==='charge'?'заряд':'ріст'), 2.2);
        absorbed = true;
        break;
      }
    }
    if (absorbed) W.drops.splice(i,1);
  }

  // 4) рух
  for (const e of els) {
    e.vx *= Math.max(0, 1 - CFG.FR*dt);
    e.vy *= Math.max(0, 1 - CFG.FR*dt);
    e.x += e.vx*dt; e.y += e.vy*dt;
    e.mass = e.ty.mass * (e.r/e.ty.baseR) * (e.r/e.ty.baseR) * 0.6;
    clamp(e);
  }

  // 5) зіткнення (штовхають одне одного)
  for (let i=0;i<els.length;i++) for (let j=i+1;j<els.length;j++) {
    const a = els[i], b = els[j];
    const dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy) || 1;
    const min = a.r + b.r;
    if (d < min) {
      const nx = dx/d, ny = dy/d;
      const overlap = min - d;
      const ma = a.mass, mb = b.mass, tot = ma+mb;
      a.x -= nx*overlap*(mb/tot); a.y -= ny*overlap*(mb/tot);
      b.x += nx*overlap*(ma/tot); b.y += ny*overlap*(ma/tot);
      const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
      const vn = rvx*nx + rvy*ny;
      if (vn < 0) {
        // удар по зв'язку рве тіло
        const bd = a.bonds.find(x=>x.o===b);
        if (bd && Math.abs(vn) > CFG.BOND_BREAK_V) {
          breakBond(a, bd, 'удар');
        }
        const imp = -(1.35)*vn/(1/ma + 1/mb);
        a.vx -= nx*imp/ma; a.vy -= ny*imp/ma;
        b.vx += nx*imp/mb; b.vy += ny*imp/mb;
        if (Math.abs(vn) > CFG.CONTACT_V) {
          // контактний імпульс: передача сили
          const ka = a.ty.props.some(p=>p.k==='contact'), kb = b.ty.props.some(p=>p.k==='contact');
          if (ka || kb) {
            const kick = Math.abs(vn)*0.55;
            if (ka) { a.vx -= nx*kick; a.vy -= ny*kick; }
            if (kb) { b.vx += nx*kick; b.vy += ny*kick; }
            evThrottle('ct'+Math.min(a.id,b.id), 'Зіткнення: ' + (ka?a.ty.name+' →':'') + (kb?' '+b.ty.name:'') + ' передає імпульс', 2.5);
          }
          spark((a.x+b.x)/2, (a.y+b.y)/2, '#ffffff', 4);
        }
      }
      // злипання: «link»-елементи самі з'єднуються при дотику
      if (a.ty.props.some(p=>p.k==='link') || b.ty.props.some(p=>p.k==='link')) tryBond(a, b);
    }
  }

  // 5b) зв'язки: тримають тіло, рвуться від удару/розтягу
  bondPass(dt);
  reportBodies(dt);

  // 6) декор
  for (let i=W.parts.length-1;i>=0;i--) { const p=W.parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.t-=dt; if (p.t<=0) W.parts.splice(i,1); }
  for (let i=W.shocks.length-1;i>=0;i--) { const s=W.shocks[i]; s.r+=(s.max-s.r)*dt*6; s.t-=dt; if (s.t<=0) W.shocks.splice(i,1); }
  for (let i=W.links.length-1;i>=0;i--) { W.links[i].t-=dt; if (W.links[i].t<=0) W.links.splice(i,1); }
  for (let i=W.events.length-1;i>=0;i--) { W.events[i].t-=dt; if (W.events[i].t<=0) W.events.splice(i,1); }
}
function clamp(e) {
  if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx)*0.4; }
  if (e.x > W.W-e.r) { e.x = W.W-e.r; e.vx = -Math.abs(e.vx)*0.4; }
  if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy)*0.4; }
  if (e.y > W.H-e.r) { e.y = W.H-e.r; e.vy = -Math.abs(e.vy)*0.4; }
}
function tryBond(a, b) {
  if (a === b) return;
  if (a.bonds.some(x=>x.o===b)) return;
  if (a.bonds.length >= 6 || b.bonds.length >= 6) return; // максимум зв'язків на елемент
  const rest = (a.r + b.r) * 0.82;
  a.bonds.push({ o:b, rest });
  b.bonds.push({ o:a, rest });
  spark((a.x+b.x)/2, (a.y+b.y)/2, '#4cc9f0', 8);
  evThrottle('bond'+Math.min(a.id,b.id), a.ty.name + ' — ' + b.ty.name + ': З\'ЄДНАНО', 1.2);
}
function breakBond(a, bd, cause) {
  const o = bd.o;
  a.bonds = a.bonds.filter(x=>x!==bd);
  o.bonds = o.bonds.filter(x=>x.o!==a);
  spark((a.x+o.x)/2, (a.y+o.y)/2, '#ef476f', 8);
  evThrottle('brk'+Math.min(a.id,o.id), 'РОЗРИВ: ' + cause + ' розірвав ' + a.ty.name + ' — ' + o.ty.name, 1.2);
  // імпульс у бік розриву
  const dx = o.x-a.x, dy = o.y-a.y, d = Math.hypot(dx,dy) || 1;
  a.vx -= dx/d*40; a.vy -= dy/d*40;
  o.vx += dx/d*40; o.vy += dy/d*40;
}
function bondPass(dt) {
  for (let iter=0; iter<2; iter++) {
    for (const e of W.els) {
      for (let bi=e.bonds.length-1; bi>=0; bi--) {
        const bd = e.bonds[bi];
        const o = bd.o;
        if (!o || !o.bonds.some(x=>x.o===e)) { e.bonds.splice(bi,1); continue; }
        const dx = o.x-e.x, dy = o.y-e.y;
        const d = Math.hypot(dx,dy) || 1;
        const diff = d - bd.rest;
        if (diff > bd.rest*CFG.BOND_BREAK_STRETCH || d > (e.r+o.r)*3) { breakBond(e, bd, 'розтяг'); continue; }
        const nx = dx/d, ny = dy/d;
        const rv = (o.vx-e.vx)*nx + (o.vy-e.vy)*ny;
        if (Math.abs(rv) > CFG.BOND_BREAK_V) { breakBond(e, bd, 'удар'); continue; }
        // пружна корекція
        const ma = e.mass, mb = o.mass, tot = ma+mb;
        const corr = diff * 0.35;
        e.x += nx*corr*(mb/tot); e.y += ny*corr*(mb/tot);
        o.x -= nx*corr*(ma/tot); o.y -= ny*corr*(ma/tot);
        // гасіння коливань уздовж зв'язку
        const damp = rv * 0.10;
        e.vx += nx*damp; e.vy += ny*damp;
        o.vx -= nx*damp; o.vy -= ny*damp;
      }
    }
  }
}
// компоненти зв'язності (тіла)
function components() {
  const seen = new Set(), comps = [];
  for (const e of W.els) {
    if (seen.has(e.id)) continue;
    const stack = [e], comp = [];
    seen.add(e.id);
    while (stack.length) {
      const c = stack.pop();
      comp.push(c);
      for (const bd of c.bonds) if (!seen.has(bd.o.id)) { seen.add(bd.o.id); stack.push(bd.o); }
    }
    comps.push(comp);
  }
  return comps;
}
function reportBodies(dt) {
  W._bt = (W._bt||0) - dt;
  if (W._bt > 0) return;
  W._bt = 1.2;
  const comps = components();
  const now = {};
  for (const c of comps) if (c.length >= 2) now[Math.min(...c.map(x=>x.id))] = c.length;
  const prev = W._bodies || {};
  for (const k in now) {
    if (prev[k] !== now[k]) {
      if (now[k] >= 3 && (!prev[k] || prev[k] < 3)) event('ТІЛО: ' + now[k] + ' елементи тримаються разом');
    }
  }
  for (const k in prev) {
    if (!now[k] && prev[k] >= 3) event('ТІЛО РОЗПАЛОСЯ: втрачено частини');
  }
  W._bodies = now;
}
function burst(b) {
  shock(b.x, b.y, CFG.BURST_R);
  spark(b.x, b.y, '#ef476f', 14);
  for (const o of W.els) {
    if (o === b) continue;
    const d = Math.hypot(o.x-b.x, o.y-b.y);
    if (d < CFG.BURST_R && d > 0.1) {
      const f = CFG.BURST_F * (1 - d/CFG.BURST_R);
      o.vx += (o.x-b.x)/d * f / o.mass;
      o.vy += (o.y-b.y)/d * f / o.mass;
    }
  }
  b.energy = 0;
  event('ВИБУХ: ' + b.ty.name + ' розкидав силу навколо');
  link(b.x, b.y, b.x + 60, b.y, 'ВИБУХ');
  b.vx += (Math.random()-0.5)*60; b.vy += (Math.random()-0.5)*60;
  // вибух рве зв'язки поруч
  for (const o of W.els) {
    if (o === b) continue;
    const d = Math.hypot(o.x-b.x, o.y-b.y);
    if (d < CFG.BURST_R * 1.2) {
      for (let bi=o.bonds.length-1; bi>=0; bi--) {
        const bd = o.bonds[bi];
        if (Math.hypot(bd.o.x-b.x, bd.o.y-b.y) < CFG.BURST_R * 1.4 || bd.o === b) {
          breakBond(o, bd, 'вибух');
        }
      }
    }
  }
  for (let bi=b.bonds.length-1; bi>=0; bi--) breakBond(b, b.bonds[bi], 'вибух');
}

// ---------------- рендер ----------------
function draw() {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(vw*dpr) || cv.height !== Math.round(vh*dpr)) { cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr); }
  // камера: повне вписування при старті, центрування, юзер може зумити
  cam.z = Math.max(0.3, Math.min(2.4, cam.z || fitZoom()));
  if (vw/cam.z >= W.W) cam.x = (vw/cam.z - W.W)/2;
  else cam.x = Math.max(0, Math.min(W.W - vw/cam.z, cam.x));
  if (vh/cam.z >= W.H) cam.y = (vh/cam.z - W.H)/2;
  else cam.y = Math.max(0, Math.min(W.H - vh/cam.z, cam.y));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(dpr*cam.z, 0, 0, dpr*cam.z, -cam.x*dpr*cam.z, -cam.y*dpr*cam.z);

  // підлога
  ctx.fillStyle = '#10141f';
  ctx.fillRect(0, 0, W.W, W.H);
  ctx.strokeStyle = 'rgba(60,80,120,0.10)';
  ctx.lineWidth = 1;
  for (let x=0; x<W.W; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,W.H); ctx.stroke(); }
  for (let y=0; y<W.H; y+=60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W.W,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(76,201,240,0.25)';
  ctx.lineWidth = 3;
  ctx.strokeRect(3, 3, W.W-6, W.H-6);

  // поля
  if (W.layers.fields) {
    for (const e of W.els) for (const p of e.ty.props) if (p.k==='emit_field') {
      ctx.strokeStyle = FCOL[p.f] + '55';
      ctx.lineWidth = 2;
      ctx.setLineDash([8,8]);
      ctx.beginPath(); ctx.arc(e.x, e.y, CFG.FIELD_R, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = FCOL[p.f] + 'aa';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('ПОЛЕ №' + p.f, e.x, e.y - CFG.FIELD_R - 8);
    }
  }

  // каузальність (завжди м'яко)
  for (const lk of W.links) {
    const a = Math.min(1, lk.t);
    ctx.strokeStyle = 'rgba(255,196,0,' + (0.7*a) + ')';
    ctx.lineWidth = 3;
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(lk.x1, lk.y1); ctx.lineTo(lk.x2, lk.y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,196,0,' + (0.9*a) + ')';
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(lk.label, (lk.x1+lk.x2)/2, (lk.y1+lk.y2)/2 - 8);
  }

  // зв'язки (тіла)
  for (const e of W.els) {
    for (const bd of e.bonds) {
      if (bd.o.id < e.id) continue;
      const dx = bd.o.x-e.x, dy = bd.o.y-e.y;
      const d = Math.hypot(dx,dy) || 1;
      const tension = Math.max(0, d - bd.rest)/bd.rest;
      ctx.strokeStyle = tension > 0.6 ? 'rgba(239,71,111,0.9)' : 'rgba(76,201,240,' + (0.35 + Math.min(0.5, tension)) + ')';
      ctx.lineWidth = 3 + tension*4;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(bd.o.x, bd.o.y); ctx.stroke();
    }
  }
  // краплі
  for (const d of W.drops) {
    ctx.globalAlpha = Math.min(1, d.t);
    ctx.fillStyle = FCOL[d.res];
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    ctx.fillStyle = FCOL[d.res] + '44';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r+5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // елементи
  for (const e of W.els) {
    if (e === dragEl) continue;
    drawElem(ctx, e);
  }
  if (dragEl) { ctx.globalAlpha = 0.85; drawElem(ctx, dragEl); ctx.globalAlpha = 1; }
  // індикатор злипання: куди прилипне елемент при відпусканні
  if (dragEl) {
    let target=null, bd=1e9;
    for (const e of W.els) {
      if (e===dragEl) continue;
      const d = Math.hypot(e.x-dragEl.x, e.y-dragEl.y);
      const lim = (e.r + dragEl.r) * CFG.SNAP;
      if (d < lim && d < bd) { bd = d; target = e; }
    }
    if (target) {
      ctx.strokeStyle = 'rgba(76,201,240,0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.arc(target.x, target.y, target.r + 10, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // частинки та хвилі
  for (const p of W.parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.t));
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const s of W.shocks) {
    ctx.strokeStyle = 'rgba(255,255,255,' + Math.max(0, s.t*1.2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.stroke();
  }
}
function drawElem(ctx, e) {
  const t = e.ty;
  // тінь
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.arc(e.x + 3, e.y + 4, e.r, 0, 7); ctx.fill();
  // форма
  ctx.fillStyle = t.color;
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 2;
  const R = e.r;
  ctx.beginPath();
  switch (t.shape) {
    case 'circle': ctx.arc(e.x, e.y, R, 0, 7); break;
    case 'ring': ctx.arc(e.x, e.y, R, 0, 7); ctx.stroke(); ctx.fillStyle='transparent'; break;
    case 'tri': tri(ctx, e.x, e.y, R); break;
    case 'square': ctx.rect(e.x-R, e.y-R, R*2, R*2); break;
    case 'star': star(ctx, e.x, e.y, R, R*0.55); break;
    case 'blob': blob(ctx, e.x, e.y, R); break;
    case 'rod': ctx.ellipse(e.x, e.y, R*1.4, R*0.55, 0.4, 0, 7); break;
    case 'diamond': diamond(ctx, e.x, e.y, R); break;
  }
  ctx.fill();
  // заряд
  if (e.energy > 2) {
    const bp = t.props.find(p=>p.k==='burst');
    const thr = bp ? bp.thr : 80;
    ctx.strokeStyle = 'rgba(239,71,111,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, R+5, 0, Math.PI*2*Math.min(1, e.energy/thr)); ctx.stroke();
    if (e.energy/thr > 0.8) { spark(e.x, e.y, '#ef476f', 1); }
  }
  // індикатор реакції на поле
  for (const p of t.props) if (p.k==='react_field') {
    ctx.strokeStyle = FCOL[p.f] + 'aa';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, R+9, 0, 7); ctx.stroke();
  }
  // ім'я
  if (cam.z > 0.55) {
    ctx.fillStyle = 'rgba(223,230,242,0.75)';
    ctx.font = 'bold ' + Math.max(10, 12*cam.z) + 'px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(t.name, e.x, e.y + R + 16);
  }
}
function tri(ctx,x,y,r){ ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.9, y+r*0.7); ctx.lineTo(x-r*0.9, y+r*0.7); ctx.closePath(); }
function star(ctx,x,y,R,r){ for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; const rr=i%2===0?R:r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); } ctx.closePath(); }
function blob(ctx,x,y,R){ const wb=Math.sin(W.t*2+x*0.05)*0.15; ctx.ellipse(x,y,R*(1+wb*0.3),R*(1-wb*0.3),0,0,7); ctx.closePath(); }
function diamond(ctx,x,y,R){ ctx.moveTo(x,y-R); ctx.lineTo(x+R,y); ctx.lineTo(x,y+R); ctx.lineTo(x-R,y); ctx.closePath(); }

// ---------------- лог ----------------
function renderLog() {
  logTimer -= 16;
  if (logTimer > 0) return;
  logTimer = 400;
  const el = document.getElementById('log');
  el.innerHTML = '';
  const n = Math.min(6, W.events.length);
  for (let i=0;i<n;i++) {
    const d = document.createElement('div');
    d.className = 'lge';
    d.textContent = W.events[i].text;
    el.appendChild(d);
  }
}

// ---------------- ввід ----------------
function bindInput() {
  const cv = document.getElementById('cv');
  let ptrs = {};
  const toWorld = (cx, cy) => {
    const rect = cv.getBoundingClientRect();
    return { x: cam.x + (cx - rect.left)/cam.z, y: cam.y + (cy - rect.top)/cam.z };
  };
  const hit = (wx, wy) => {
    let best=null, bd=1e9;
    for (const e of W.els) {
      const d = Math.hypot(e.x-wx, e.y-wy);
      if (d < e.r + 14 && d < bd) { bd = d; best = e; }
    }
    return best;
  };
  const down = (id, x, y) => {
    const w = toWorld(x, y);
    const el = hit(w.x, w.y);
    if (el && !pinch) {
      dragEl = el;
      dragDX = el.x - w.x; dragDY = el.y - w.y;
      el._dvx = 0; el._dvy = 0;
      ptrs[id] = { x, y, t: performance.now(), el: true };
    } else {
      ptrs[id] = { x, y, t: performance.now(), el: false };
    }
  };
  const move = (id, x, y) => {
    const pt = ptrs[id];
    if (!pt) return;
    if (dragEl && pt.el) {
      const w = toWorld(x, y);
      const nx = w.x + dragDX, ny = w.y + dragDY;
      dragEl._dvx = (nx - dragEl.x) * 60;
      dragEl._dvy = (ny - dragEl.y) * 60;
      dragEl.x = nx; dragEl.y = ny;
      dragEl.vx = 0; dragEl.vy = 0;
      clamp(dragEl);
      pt.x = x; pt.y = y;
      return;
    }
    if (!dragEl) {
      const dx = x - pt.x, dy = y - pt.y;
      cam.x -= dx/cam.z; cam.y -= dy/cam.z;
      pt.x = x; pt.y = y;
    }
  };
  const up = (id, x, y) => {
    const pt = ptrs[id];
    delete ptrs[id];
    if (dragEl && pt && pt.el) {
      dragEl.vx = dragEl._dvx || 0;
      dragEl.vy = dragEl._dvy || 0;
      // злипання при відпусканні поруч
      let target=null, bd=1e9;
      for (const e of W.els) {
        if (e===dragEl) continue;
        const d = Math.hypot(e.x-dragEl.x, e.y-dragEl.y);
        const lim = (e.r + dragEl.r) * CFG.SNAP;
        if (d < lim && d < bd) { bd = d; target = e; }
      }
      if (target) tryBond(dragEl, target);
      dragEl = null;
    }
  };
  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      ptrs[t.identifier] = { x:t.clientX, y:t.clientY, t:performance.now(), el:false };
      const w = toWorld(t.clientX, t.clientY);
      const el = hit(w.x, w.y);
      if (el && Object.keys(ptrs).length === 1) {
        dragEl = el; dragDX = el.x-w.x; dragDY = el.y-w.y; el._dvx=0; el._dvy=0;
        ptrs[t.identifier].el = true;
      }
    }
  }, {passive:false});
  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) move(t.identifier, t.clientX, t.clientY);
  }, {passive:false});
  cv.addEventListener('touchend', e => {
    for (const t of e.changedTouches) up(t.identifier, t.clientX, t.clientY);
  });
  cv.addEventListener('mousedown', e => { down(0, e.clientX, e.clientY); });
  cv.addEventListener('mousemove', e => { if (ptrs[0]) move(0, e.clientX, e.clientY); });
  cv.addEventListener('mouseup', e => { up(0, e.clientX, e.clientY); });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.15 : 0.87;
    cam.z = Math.max(0.3, Math.min(2.4, cam.z * f));
  }, {passive:false});
}
function bindButtons() {
  const $ = id => document.getElementById(id);
  const setMode = m => { W.mode = m; $('bPlay').classList.toggle('on', m==='play'); $('bSlow').classList.toggle('on', m==='slow'); $('bPause').classList.toggle('pause', m==='pause'); };
  $('bPlay').onclick = ()=>setMode('play');
  $('bSlow').onclick = ()=>setMode(W.mode==='slow' ? 'play' : 'slow');
  $('bPause').onclick = ()=>setMode(W.mode==='pause' ? 'play' : 'pause');

  $('bForces').onclick = ()=>{ W.layers.forces = !W.layers.forces; $('bForces').classList.toggle('on', W.layers.forces); };
  $('bDrops').onclick = ()=>{ W.layers.drops = !W.layers.drops; $('bDrops').classList.toggle('on', W.layers.drops); };
  $('bTypes').onclick = ()=>{ document.getElementById('types').classList.toggle('open'); };

function refreshSeed() {
  document.getElementById('tseed').textContent = 'seed ' + W.seed;
}

// ---------------- головний цикл ----------------
let lastT = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastT)/1000 || 0.016);
  lastT = ts;
  if (W) step(dt);
  if (W) draw();
  if (W) renderLog();
  requestAnimationFrame(loop);
}

// ---------------- dev-хуки ----------------
window.__G = {
  state(){
    const comps = W && W.els ? components() : [];
    return {
      seed: W.seed, t: Math.round(W.t*10)/10, mode: W.mode,
      types: W.types.map(t=>({ name:t.name, color:t.color, shape:t.shape, props:t.props.map(propText) })),
      els: W.els.length, drops: W.drops.length, events: W.events.slice(0,5).map(e=>e.text),
      bonds: W.els.reduce((m,e)=>m+e.bonds.length,0)/2,
      bodies: comps.filter(c=>c.length>=2).map(c=>c.length).sort((a,b)=>b-a),
      moved: W.els.reduce((m,e)=>Math.max(m, Math.hypot(e.vx,e.vy)), 0),
    };
  },
  bondPair(i,j){
    if (i<W.els.length && j<W.els.length) tryBond(W.els[i], W.els[j]);
    return this.state();
  },
  newWorld(seed){ newWorld(seed); refreshSeed(); return this.state(); },
  fast(sec){ const n = Math.ceil(sec/0.016); for (let i=0;i<n;i++) step(0.016); return this.state(); },
  setMode(m){ W.mode = m; document.getElementById('bPlay').classList.toggle('on', m==='play'); document.getElementById('bSlow').classList.toggle('on', m==='slow'); document.getElementById('bPause').classList.toggle('pause', m==='pause'); },
  dragTo(i, x, y, holdSec){
    const e = W.els[i];
    e.x = x; e.y = y; e.vx = 0; e.vy = 0;
    const n = Math.ceil((holdSec||1)/0.016);
    for (let k=0;k<n;k++) step(0.016);
    return this.state();
  },
};

// ---------------- старт ----------------
bindInput();
bindButtons();
newWorld((Math.random()*1e9)|0);
refreshSeed();
requestAnimationFrame(loop);
</script>
