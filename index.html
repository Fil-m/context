    max-width:94%; text-align:center; }

<body>
<canvas id="cv"></canvas>

<div id="top">
  <div id="tname">CONTEXT<span style="color:#6b7c99"> v3.2 · Тіло</span></div>
  <div id="tseed"></div>
  <div style="flex:1"></div>
  <div style="display:flex;gap:6px">
    <button class="btn" id="bPlay" title="пуск">▶</button>
    <button class="btn" id="bSlow" title="сповільнено">🐌</button>
    <button class="btn" id="bPause" title="пауза">⏸</button>
    <button class="btn" id="bFields" title="поля">◉</button>
    <button class="btn" id="bForces" title="сили">⇶</button>

    <button class="btn" id="bTypes" title="типи">☰</button>
    <button class="btn" id="bFit" title="весь світ">⌂</button>

  </div>
</div>
<div id="tip">Тягни уламки в ТІЛО (каркас) → заповни 3 слоти → тіло оживе. Довгий тап по елементу — розібрати на шматочки. Тягни фон — карта · колесо/щипок — масштаб. 🧾 — лог вводу.</div>
<div id="log"></div>
<div id="types"></div>
<div id="inlog"></div>
<div id="hint"></div>

<script>
'use strict';
/* ============================================================
   CONTEXT v3 — ТІЛО
   Світ = уламки (неактивні шматочки з мітками) + природні
   елементи (живі збірки). Гравець складає уламки в ТІЛО —
   каркас із 3 слотів. Повна схема активує тіло: воно оживає
   і взаємодіє з полями світу. Форми — процедурні полігони,
   унікальні для кожного типу.
   ============================================================ */

// ---------------- RNG / імена ----------------
function rng(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SYL = ['ко','ра','ве','ки','мі','ша','ду','на','тор','глі','фо','зей','лу','пі','ар','ен','ква','ро','са','ти'];
function genName(r) {
  const s = ()=>SYL[(r()*SYL.length)|0];
  return s().replace(/^./, c=>c.toUpperCase()) + s() + '-' + (1 + ((r()*97)|0));
}
const PALETTE = ['#4cc9f0','#fca311','#b388ff','#6ee7a0','#ef476f','#ffd60a','#80ed99','#ff8fa3','#74c0fc','#c0eb75','#ffa94d','#9775fa'];
const FCOL = ['#4cc9f0','#fca311','#b388ff'];
const RNAME = ['◆','●','▲'];
const EFF_UA = { repel:'ВІДШТОВХ', attract:'ПРИТЯГ', charge:'ЗАРЯД', grow:'РІСТ' };

// ---------------- генеративні форми ----------------
// випадковий полігон: n вершин, радіуси з розкидом → жодна форма не повторюється
function genShape(r, nMin, nMax, rrMin, rrMax) {
  const n = nMin + ((r()*(nMax-nMin+1))|0);
  const pts = [];
  for (let i=0;i<n;i++) {
    const a = (i + r()*0.4) / n * Math.PI * 2;
    const rr = rrMin + r()*(rrMax-rrMin);
    pts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
  }
  return pts;
}
// «загостреність» форми: чим більший розкид вершин — тим «чіпкіша» форма (легше злипається)
function shapeGrip(pts) {
  let mn = 1e9, mx = 0;
  for (const p of pts) { const r = Math.hypot(p[0], p[1]); mn = Math.min(mn, r); mx = Math.max(mx, r); }
  return 1 + Math.min(0.5, (mx - mn) * 0.55);
}
// шматок форми: беремо підмножину вершин → уламок «схожий на батька»
function shapeShard(pts, r) {
  const n = 3 + ((r()*3)|0);
  const out = [];
  for (let i=0;i<n;i++) {
    const src = pts[(r()*pts.length)|0];
    out.push([src[0]*(0.7+r()*0.5), src[1]*(0.7+r()*0.5)]);
  }
  return out;
}
function polyPath(ctx, x, y, R, pts, rot) {
  ctx.beginPath();
  const c = Math.cos(rot), s = Math.sin(rot);
  for (let i=0;i<pts.length;i++) {
    const a = pts[i][0]*R, b = pts[i][1]*R;
    const px = x + a*c - b*s, py = y + a*s + b*c;
    if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function shapeIconFor(pts) {
  return pts.length >= 7 ? '⬡' : (pts.length >= 5 ? '⬢' : '△');
}

// ---------------- властивості та ролі ----------------
function randProp(r) {
  const pick = (r()*11)|0;
  switch (pick) {
    case 0: case 1: return {k:'emit_field', f:(r()*3)|0};
    case 2: case 3: return {k:'react_field', f:(r()*3)|0, eff:['repel','attract','charge','grow'][(r()*4)|0]};
    case 4: return {k:'emit_drop', res:(r()*3)|0};
    case 5: return {k:'absorb_drop', res:(r()*3)|0, eff:['charge','grow'][(r()*2)|0]};
    case 6: return {k:'burst', thr:50 + (r()*60)|0};
    case 7: return {k:'heavy'};
    case 8: return {k:'light'};
    case 9: return {k:'contact'};
    case 10: return {k:'link'};
  }
}
function propText(p) {
  switch (p.k) {
    case 'emit_field':  return 'Випромінює поле №' + p.f;
    case 'react_field': return EFF_UA[p.eff] + ' поля №' + p.f;
    case 'emit_drop':   return 'Випромінює ресурс ' + RNAME[p.res];
    case 'absorb_drop': return 'Поглинає ' + RNAME[p.res] + ' → ' + (p.eff==='charge'?'заряд':'ріст');
    case 'burst':       return 'Заряд >' + p.thr + ' → ВИБУХ';
    case 'heavy':       return 'Важкий';
    case 'light':       return 'Легкий';
    case 'contact':     return 'Передає імпульс';
    case 'link':        return 'Злипається при дотику';
  }
  return p.k;
}
// мітка-роль уламка (коротка, для світу)
function fragRole(p) {
  switch (p.k) {
    case 'emit_field':  return 'ПОЛЕ №' + p.f;
    case 'react_field': return EFF_UA[p.eff] + ' №' + p.f;
    case 'emit_drop':   return 'РЕСУРС ' + RNAME[p.res];
    case 'absorb_drop': return 'ПОГЛИНАЧ ' + RNAME[p.res];
    case 'burst':       return 'НАПРУГА';
    case 'contact':     return 'КОНТАКТ';
    case 'link':        return 'ЗЧЕПЛЕННЯ';
    case 'heavy':       return 'МАСА';
    case 'light':       return 'ЛЕГКІСТЬ';
  }
  return 'УЛАМОК';
}

// ---------------- стан ----------------
let W = null;
let cam = { x:0, y:0, z:1 };
let dragEl = null, panPtr = null, pinch = null;
let logTimer = 0, hintTimer = 0;
let fragId = 1;

// ---------------- лог вводу (діагностика) ----------------
const inputLog = [];
function ilog(msg, cls) {
  inputLog.push({ t: W ? Math.round(W.t*10)/10 : 0, msg, cls: cls||'' });
  if (inputLog.length > 150) inputLog.shift();
}
window.__inputLog = inputLog;
function fmtCam() {
  return 'cam=' + Math.round(cam.x) + ',' + Math.round(cam.y) + ' z=' + Math.round(cam.z*100)/100;
}
function renderInLog() {
  const el = document.getElementById('inlog');
  if (!el || !el.classList.contains('open')) return;
  const n = Math.min(45, inputLog.length);
  let h = '<div class="ilh"><b style="color:#fca311;font-size:11px">ЛОГ ВВОДУ · ' + inputLog.length + '</b>' +
          '<button class="btn" id="ibtn" style="min-width:0;height:28px;padding:0 8px;font-size:11px">📋 копіювати</button></div>';
  for (let i = inputLog.length - n; i < inputLog.length; i++) {
    const e = inputLog[i];
    h += '<div class="il"><span class="ilt">t=' + e.t + 's</span> <span class="' + (e.cls||'ilb') + '">' + e.msg + '</span></div>';
  }
  el.innerHTML = h;
  const btn = document.getElementById('ibtn');
  if (btn) btn.onclick = () => {
    const txt = inputLog.map(e => 't=' + e.t + 's ' + e.msg).join('\n');
    const done = () => { btn.textContent = '✓ скопійовано'; setTimeout(()=>btn.textContent='📋 копіювати', 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
    } else fallbackCopy(txt, done);
  };
}
function fallbackCopy(txt, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  } catch(e) { prompt('Скопіюй вручну:', txt); }
}

// ---------------- генерація типу ----------------
function genType(r, id) {
  const t = {
    id, name: genName(r),
    color: PALETTE[(r()*PALETTE.length)|0],
    pts: genShape(r, 5, 9, 0.62, 1.15),
    props: [],
    mass: 1 + r()*1.6,
    baseR: 22 + r()*22,
  };
  t.grip = shapeGrip(t.pts);
  const n = 2 + ((r()*3)|0);   // 2-4 властивості
  for (let i=0;i<n;i++) t.props.push(randProp(r));
  const hasHeavy = t.props.some(p=>p.k==='heavy'), hasLight = t.props.some(p=>p.k==='light');
  if (hasHeavy && hasLight) t.props = t.props.filter(p => p.k !== 'light');
  if (hasHeavy) t.mass *= 3.2;
  if (hasLight) t.mass *= 0.35;
  // частини типу: розбивка властивостей на 3 шматки (деякі можуть бути порожніми)
  t.parts = [0,1,2].map(i => {
    const chunk = t.props.filter((_, idx) => idx % 3 === i);
    return chunk.length ? chunk : [];
  });
  return t;
}

// ---------------- уламки (шматочки) ----------------
function makeFrag(r, color, props, pts, x, y) {
  const p0 = props[0] || null;
  return {
    id: fragId++,
    color: color || PALETTE[(r()*PALETTE.length)|0],
    props,
    role: p0 ? fragRole(p0) : 'УЛАМОК',
    pts: pts || genShape(r, 3, 6, 0.55, 1.0),
    rot: r()*6.28,
    x, y, r: 13 + r()*6,
  };
}
function pushFrag(w, r, ty, props, x, y) {
  // уламок від типу: беремо одну з його частин (або довільний шматок)
  let pts, color, pr;
  if (ty) {
    const pi = (r()*ty.parts.length)|0;
    pr = ty.parts[pi] || [];
    pts = shapeShard(ty.pts, r);
    color = ty.color;
  } else {
    pr = props || [randProp(r)];
    pts = genShape(r, 3, 6, 0.55, 1.0);
    color = null;
  }
  w.frags.push(makeFrag(r, color, pr, pts,
    x !== undefined ? x : 50 + r()*(w.W-100),
    y !== undefined ? y : 60 + r()*(w.H-120)));
}
function addFragProp(fr, p) {
  if (fr.props.length < 3) fr.props.push(p);
  const p0 = fr.props[0] || null;
  fr.role = p0 ? fragRole(p0) : 'УЛАМОК';
}

// ---------------- генерація світу ----------------
function worldDims() {
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  if (portrait) return { W: 520, H: Math.max(820, Math.min(1200, Math.round(520 * window.innerHeight / window.innerWidth))) };
  return { W: 1500, H: Math.max(640, Math.min(1000, Math.round(1500 * window.innerHeight / window.innerWidth))) };
}
function minZoom() {
  // мінімальний комфортний зум: видно ВЕСЬ світ (100%)
  return Math.min(window.innerWidth / W.W, window.innerHeight / W.H);
}
function fitZoom() {
  // стартовий зум = весь світ видно. БЕЗ *1.12 — гравець хоче бачити все,
  // а не крупний план (скарга "надто крупно" була саме через множник 1.12)
  return Math.max(0.25, Math.min(3.2, minZoom()));
}
function centerCam() {
  // камера по центру світу (з полями, якщо світ менший за екран)
  cam.x = (W.W - window.innerWidth / cam.z) / 2;
  cam.y = (W.H - window.innerHeight / cam.z) / 2;
}
function newWorld(seed) {
  const r = rng(seed || ((Math.random()*1e9)|0));
  const d = worldDims();
  const w = {
    seed, W:d.W, H:d.H, types:[], els:[], frags:[], drops:[], shocks:[], parts:[], links:[], events:[],
    t:0, mode:'play', layers:{fields:false, forces:false, drops:false}, hover:null,
  };
  // типи: 9-12, кожен з унікальною формою і частинами
  const nTypes = 9 + ((r()*4)|0);
  for (let i=0;i<nTypes;i++) w.types.push(genType(r, i));
  // уламки: 16-22 (з типів + універсальні)
  const nFrags = 16 + ((r()*7)|0);
  for (let i=0;i<nFrags;i++) {
    if (r() < 0.6) pushFrag(w, r, w.types[(r()*w.types.length)|0]);
    else pushFrag(w, r, null, null);
  }
  // природні елементи (живі збірки)
  const nInst = (d.W < 700 ? 20 : 26) + ((r()*8)|0);
  for (let i=0;i<nInst;i++) {
    const ty = w.types[(r()*w.types.length)|0];
    w.els.push({
      id:i, ty, x: 60 + r()*(w.W-120), y: 70 + r()*(w.H-140),
      vx:(r()-0.5)*30, vy:(r()-0.5)*30, r: ty.baseR*(0.8 + r()*0.5), mass:ty.mass,
      energy:0, cd:r()*3, hitCd:0, bonds:[], rot:r()*6.28,
    });
  }
  // ТІЛО: каркас із 3 слотів
  w.body = {
    x: d.W/2, y: d.H*0.5,
    vx:0, vy:0, scale:1, energy:0,
    slots:[null, null, null],
    active:false, r: 46,
  };
  W = w;
  ensurePairs(w, r);
  try { window.__W = w; } catch(e) {}
  cam = { x:0, y:0, z: fitZoom() };
  // стартова камера — по центру світу (не в куті, нічого не обрізано)
  centerCam();
  try { window.__cam = cam; } catch(e) {}
  // на мобільному адресний бар ховається після завантаження → innerHeight росте →
  // fitZoom, порахований при малому в'юпорті, лишає світ крихітним. Перераховуємо через 400ms.
  setTimeout(() => {
    if (!W) return;
    cam.z = fitZoom();
    centerCam();
    if (window.__clampCam) window.__clampCam();
    ilog("старт: вюпорт " + window.innerWidth + "x" + window.innerHeight + " · " + fmtCam());
  }, 400);
  ilog('newWorld seed=' + seed + ' світ ' + w.W + 'x' + w.H + ' (vp ' + window.innerWidth + 'x' + window.innerHeight + ')', 'ilc');
  buildTypesPanel();
  return w;
}
function ensurePairs(w, r) {
  // 1) серед els-типів є емітер поля
  const emitted = new Set();
  for (const t of w.types) for (const p of t.props) if (p.k==='emit_field') emitted.add(p.f);
  if (emitted.size === 0) {
    w.types[0].props.push({k:'emit_field', f:(r()*3)|0});
    emitted.add(w.types[0].props.find(p=>p.k==='emit_field').f);
  }
  // 2) на кожне емітоване поле є реактор СЕРЕД УЛАМКІВ (щоб тіло могло реагувати)
  for (const f of emitted) {
    const hasReactor = w.frags.some(fr => fr.props.some(p => p.k==='react_field' && p.f===f));
    if (!hasReactor) {
      const fr = w.frags[(r()*w.frags.length)|0];
      addFragProp(fr, {k:'react_field', f, eff: r()<0.6?'repel':(r()<0.8?'attract':['charge','grow'][(r()*2)|0])});
    }
  }
  // 3) хоча б один уламок з ВІДШТОВХ/ПРИТЯГ (тіло має чим рухатись)
  if (!w.frags.some(fr => fr.props.some(p => p.k==='react_field' && (p.eff==='repel'||p.eff==='attract')))) {
    const f = emitted.values().next().value;
    addFragProp(w.frags[0], {k:'react_field', f, eff:'repel'});
  }
  // 4) поля, які емітять уламки, мають реакторів серед els-типів (тіло впливає на світ)
  const femit = new Set();
  for (const fr of w.frags) for (const p of fr.props) if (p.k==='emit_field') femit.add(p.f);
  for (const f of femit) {
    if (!w.types.some(t => t.props.some(p => p.k==='react_field' && p.f===f))) {
      w.types[(r()*w.types.length)|0].props.push({k:'react_field', f, eff:['repel','attract','charge','grow'][(r()*4)|0]});
    }
  }
  // 5) якщо є заряд — має бути хоча б один вибух
  const hasCharge = w.frags.some(fr=>fr.props.some(p=>p.k==='react_field'&&p.eff==='charge')) ||
                    w.types.some(t=>t.props.some(p=>p.k==='react_field'&&p.eff==='charge'));
  if (hasCharge && !w.frags.some(fr=>fr.props.some(p=>p.k==='burst')) && !w.types.some(t=>t.props.some(p=>p.k==='burst'))) {
    const fr = w.frags[(r()*w.frags.length)|0];
    addFragProp(fr, {k:'burst', thr:60});
  }
}

// ---------------- ТІЛО ----------------
// позиції слотів у локальних координатах (трикутник)
const BODY_SLOTS = [[0,-34],[-29,20],[29,20]];
function bodySlotXY(i) {
  const s = BODY_SLOTS[i];
  return { x: W.body.x + s[0]*W.body.scale, y: W.body.y + s[1]*W.body.scale };
}
function bodyProps() {
  const out = [];
  for (const s of W.body.slots) if (s) for (const p of s.props) out.push(p);
  return out;
}
function bodyMass() {
  let m = 3.4;
  const bp = bodyProps();
  if (bp.some(p=>p.k==='heavy')) m *= 3.0;
  if (bp.some(p=>p.k==='light')) m *= 0.4;
  return m;
}
function updateBody() {
  const full = W.body.slots.every(s => !!s);
  if (full && !W.body.active) {
    W.body.active = true;
    W.body.scale = 1.15;
    const names = W.body.slots.map(s=>s.role).join(' + ');
    event('ТІЛО ОЖИЛО: ' + names);
    ilog('ТІЛО ОЖИЛО: ' + names, 'ilc');
    hint('ТІЛО ОЖИЛО — тепер воно реагує на поля світу');
  } else if (!full && W.body.active) {
    W.body.active = false;
    W.body.vx = 0; W.body.vy = 0; W.body.energy = 0; W.body.scale = 1;
    event('ТІЛО ЗАВМЕРЛО: схема неповна');
    ilog('ТІЛО ЗАВМЕРЛО', 'ile');
  }
}
function insertFrag(fr, slot) {
  if (slot < 0 || slot > 2) return false;
  if (W.body.slots[slot]) return false;
  const fi = W.frags.indexOf(fr);
  if (fi >= 0) W.frags.splice(fi, 1);
  W.body.slots[slot] = fr;
  spark(W.body.x, W.body.y, '#4cc9f0', 8);
  ilog('ВСТАВИТИ слот ' + slot + ': ' + fr.role, 'ilc');
  updateBody();
  return true;
}
function ejectSlot(slot) {
  const fr = W.body.slots[slot];
  if (!fr) return false;
  const s = bodySlotXY(slot);
  fr.x = s.x + (Math.random()-0.5)*30; fr.y = s.y + (Math.random()-0.5)*30;
  W.body.slots[slot] = null;
  W.frags.push(fr);
  spark(W.body.x, W.body.y, '#fca311', 6);
  ilog('ВИЙНЯТИ слот ' + slot + ': ' + fr.role);
  updateBody();
  return true;
}
function ejectAllBody() {
  for (let i=2;i>=0;i--) ejectSlot(i);
  W.body.vx = 0; W.body.vy = 0; W.body.energy = 0;
  event('ТІЛО РОЗІБРАНО');
}
function dismantle(e) {
  // природний елемент розпадається на свої частини
  const x = e.x, y = e.y;
  const ty = e.ty;
  // розірвати зв'язки
  for (let bi=e.bonds.length-1; bi>=0; bi--) breakBond(e, e.bonds[bi], 'розбір');
  W.els = W.els.filter(o => o !== e);
  let added = 0;
  const rr = rng((Math.random()*1e9)|0);
  for (const part of ty.parts) {
    if (!part.length) continue;
    const fx = x + (Math.random()-0.5)*70, fy = y + (Math.random()-0.5)*70;
    W.frags.push(makeFrag(rr, ty.color, part, shapeShard(ty.pts, rr), fx, fy));
    added++;
  }
  spark(x, y, ty.color, 12);
  ilog('РОЗІБРАНО ' + ty.name + ' → ' + added + ' шматочки', 'ile');
  event('РОЗІБРАНО: ' + ty.name + ' → ' + added + ' шматочки');
}

function buildTypesPanel() {

// ---------------- події / декор ----------------
function event(text) {
  W.events.unshift({ text, t:9 });
  if (W.events.length > 7) W.events.pop();
}
function evThrottle(key, text, dt) {
  const k = W._ev || (W._ev = {});
  k[key] = (k[key]||0) - dt;
  if (k[key] <= 0) { event(text); k[key] = 2.2; }
}
function link(x1,y1,x2,y2,label) {
  W.links.push({ x1,y1,x2,y2,label,t:1.8 });
  if (W.links.length > 10) W.links.shift();
}
function shock(x,y,r) { W.shocks.push({ x,y, r:0, max:r, t:0.5 }); }
function spark(x,y,c,n) {
  for (let i=0;i<n;i++) W.parts.push({ x, y, vx:(Math.random()-0.5)*80, vy:(Math.random()-0.5)*80, t:0.6, c, r:2.5 });
}
function hint(text, sec) {
  const el = document.getElementById('hint');
  el.textContent = text;
  el.style.display = 'block';
  hintTimer = sec || 3.5;
}

// ---------------- фізика ----------------
const CFG = {
  FR: 0.9,
  FIELD_R: 120,
  FIELD_F: 1000,
  CHARGE_R: 26,
  GROW_R: 3.2,
  BURST_R: 95,
  BURST_F: 320,
  DROP_CD: 3.2,
  DROP_LIFE: 4.5,
  DROP_ABSORB: 40,
  CONTACT_V: 60,
  EN_DECAY: 0.25,
  SNAP: 1.55,
  BOND_BREAK_V: 300,
  BOND_BREAK_STRETCH: 1.7,
  BODY_MASS: 2.6,
};

function step(dt) {
  if (W.mode==='pause') return;
  if (W.mode==='slow') dt *= 0.3;
  W.t += dt;
  const els = W.els;
  const B = W.body;

  // 1) поля: els-емітери → els-реактори (як раніше)
  for (const a of els) {
    for (const pa of a.ty.props) {
      if (pa.k !== 'emit_field') continue;
      for (const b of els) {
        if (b === a) continue;
        for (const pb of b.ty.props) {
          if (pb.k !== 'react_field' || pb.f !== pa.f) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d > CFG.FIELD_R) continue;
          const f = CFG.FIELD_F * (1 - d/CFG.FIELD_R) * dt;
          if (pb.eff === 'repel') { b.vx += dx/d*f; b.vy += dy/d*f; }
          else if (pb.eff === 'attract') { b.vx -= dx/d*f; b.vy -= dy/d*f; }
          else if (pb.eff === 'charge') { b.energy += CFG.CHARGE_R * dt; }
          else if (pb.eff === 'grow') { b.r = Math.min(b.ty.baseR*1.9, b.r + CFG.GROW_R*dt); }
        }
      }
    }
  }
  // 1b) els-емітери → ТІЛО (якщо тіло активне і має реактор)
  if (B.active) {
    const bProps = bodyProps();
    for (const a of els) {
      for (const pa of a.ty.props) {
        if (pa.k !== 'emit_field') continue;
        for (const pb of bProps) {
          if (pb.k !== 'react_field' || pb.f !== pa.f) continue;
          const dx = B.x - a.x, dy = B.y - a.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d > CFG.FIELD_R) continue;
          const f = CFG.FIELD_F * 0.55 * (1 - d/CFG.FIELD_R) * dt;   // тіло важче/повільніше реагує
          if (pb.eff === 'repel') { B.vx += dx/d*f; B.vy += dy/d*f; }
          else if (pb.eff === 'attract') { B.vx -= dx/d*f; B.vy -= dy/d*f; }
          else if (pb.eff === 'charge') { B.energy += CFG.CHARGE_R * dt; }
          else if (pb.eff === 'grow') { B.scale = Math.min(1.4, B.scale + CFG.GROW_R*dt*0.03); }
        }
      }
    }
    // 1c) ТІЛО-емітер → els-реактори
    for (const pa of bProps) {
      if (pa.k !== 'emit_field') continue;
      for (const b of els) {
        for (const pb of b.ty.props) {
          if (pb.k !== 'react_field' || pb.f !== pa.f) continue;
          const dx = b.x - B.x, dy = b.y - B.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d > CFG.FIELD_R) continue;
          const f = CFG.FIELD_F * (1 - d/CFG.FIELD_R) * dt;
          if (pb.eff === 'repel') { b.vx += dx/d*f; b.vy += dy/d*f; }
          else if (pb.eff === 'attract') { b.vx -= dx/d*f; b.vy -= dy/d*f; }
          else if (pb.eff === 'charge') { b.energy += CFG.CHARGE_R * dt; }
          else if (pb.eff === 'grow') { b.r = Math.min(b.ty.baseR*1.9, b.r + CFG.GROW_R*dt); }
        }
      }
    }
  }

  // 2) накопичений заряд → вибух (els і тіло)
  for (const b of els) {
    b.energy = Math.max(0, b.energy - CFG.EN_DECAY*dt);
    if (b.ty.props.some(p=>p.k==='burst') && b.energy >= b.ty.props.find(p=>p.k==='burst').thr) burst(b);
  }
  if (B.active) {
    B.energy = Math.max(0, B.energy - CFG.EN_DECAY*dt);
    const bp = bodyProps().find(p=>p.k==='burst');
    if (bp && B.energy >= bp.thr) bodyBurst();
  }

  // 3) краплі ресурсів (els + тіло)
  for (const e of els) {
    const em = e.ty.props.find(p=>p.k==='emit_drop');
    if (em) {
      e.cd -= dt;
      if (e.cd <= 0) {
        e.cd = CFG.DROP_CD * (0.6 + Math.random()*0.8);
        W.drops.push({ x:e.x, y:e.y, vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40, res:em.res, t:CFG.DROP_LIFE, r:4.5 });
      }
    }
  }
  if (B.active) {
    const bem = bodyProps().find(p=>p.k==='emit_drop');
    if (bem) {
      B._cd = (B._cd||0) - dt;
      if (B._cd <= 0) {
        B._cd = CFG.DROP_CD * (0.6 + Math.random()*0.8);
        W.drops.push({ x:B.x, y:B.y, vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40, res:bem.res, t:CFG.DROP_LIFE, r:4.5 });
      }
    }
  }
  for (let i=W.drops.length-1;i>=0;i--) {
    const d = W.drops[i];
    d.t -= dt;
    if (d.t <= 0) { W.drops.splice(i,1); continue; }
    d.vx *= Math.max(0, 1 - 0.5*dt);
    d.vy *= Math.max(0, 1 - 0.5*dt);
    d.x += d.vx*dt; d.y += d.vy*dt;
    clampDrop(d);
    let absorbed = false;
    for (const e of els) {
      const ap = e.ty.props.find(p=>p.k==='absorb_drop' && p.res===d.res);
      if (ap && Math.hypot(e.x-d.x, e.y-d.y) < CFG.DROP_ABSORB) {
        if (ap.eff==='charge') e.energy += 14;
        else e.r = Math.min(e.ty.baseR*1.9, e.r + 4);
        spark(e.x, e.y, FCOL[d.res], 6);
        evThrottle('ab'+e.id+d.res, e.ty.name + ' поглинув ' + RNAME[d.res] + ' → ' + (ap.eff==='charge'?'заряд':'ріст'), 2.2);
        absorbed = true;
        break;
      }
    }
    if (!absorbed && B.active) {
      const ap = bodyProps().find(p=>p.k==='absorb_drop' && p.res===d.res);
      if (ap && Math.hypot(B.x-d.x, B.y-d.y) < CFG.DROP_ABSORB) {
        if (ap.eff==='charge') B.energy += 14;
        else B.scale = Math.min(1.4, B.scale + 0.05);
        spark(B.x, B.y, FCOL[d.res], 6);
        evThrottle('abB'+d.res, 'ТІЛО поглинуло ' + RNAME[d.res] + ' → ' + (ap.eff==='charge'?'заряд':'ріст'), 2.2);
        absorbed = true;
      }
    }
    if (absorbed) W.drops.splice(i,1);
  }

  // 4) рух els
  for (const e of els) {
    e.vx *= Math.max(0, 1 - CFG.FR*dt);
    e.vy *= Math.max(0, 1 - CFG.FR*dt);
    e.x += e.vx*dt; e.y += e.vy*dt;
    e.rot = (e.rot||0) + e.vx*dt*0.004;
    e.mass = e.ty.mass * (e.r/e.ty.baseR) * (e.r/e.ty.baseR) * 0.6;
    clampEl(e);
  }
  // 4b) рух ТІЛА (тільки активне; неактивне стоїть)
  if (B.active) {
    B.vx *= Math.max(0, 1 - CFG.FR*dt);
    B.vy *= Math.max(0, 1 - CFG.FR*dt);
    B.x += B.vx*dt; B.y += B.vy*dt;
    clampBody();
  } else { B.vx = 0; B.vy = 0; }

  // 5) зіткнення els↔els (як раніше)
  for (let i=0;i<els.length;i++) for (let j=i+1;j<els.length;j++) {
    const a = els[i], b = els[j];
    const dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy) || 1;
    const min = a.r + b.r;
    if (d < min) {
      const nx = dx/d, ny = dy/d;
      const overlap = min - d;
      const ma = a.mass, mb = b.mass, tot = ma+mb;
      a.x -= nx*overlap*(mb/tot); a.y -= ny*overlap*(mb/tot);
      b.x += nx*overlap*(ma/tot); b.y += ny*overlap*(ma/tot);
      const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
      const vn = rvx*nx + rvy*ny;
      if (vn < 0) {
        const bd = a.bonds.find(x=>x.o===b);
        if (bd && Math.abs(vn) > CFG.BOND_BREAK_V) breakBond(a, bd, 'удар');
        const imp = -(1.35)*vn/(1/ma + 1/mb);
        a.vx -= nx*imp/ma; a.vy -= ny*imp/ma;
        b.vx += nx*imp/mb; b.vy += ny*imp/mb;
        if (Math.abs(vn) > CFG.CONTACT_V) {
          const ka = a.ty.props.some(p=>p.k==='contact'), kb = b.ty.props.some(p=>p.k==='contact');
          if (ka || kb) {
            const kick = Math.abs(vn)*0.55;
            if (ka) { a.vx -= nx*kick; a.vy -= ny*kick; }
            if (kb) { b.vx += nx*kick; b.vy += ny*kick; }
          }
          spark((a.x+b.x)/2, (a.y+b.y)/2, '#ffffff', 4);
        }
      }
      if (a.ty.props.some(p=>p.k==='link') || b.ty.props.some(p=>p.k==='link')) {
        const lim = (a.r + b.r) * CFG.SNAP * a.ty.grip;
        tryBond(a, b, lim);
      }
    }
  }
  // 5b) els ↔ ТІЛО (активне тіло — фізичне тіло)
  if (B.active) {
    const bm = bodyMass();
    for (const e of els) {
      const dx = e.x - B.x, dy = e.y - B.y;
      const d = Math.hypot(dx, dy) || 1;
      const min = e.r + B.r * B.scale * 0.8;
      if (d < min) {
        const nx = dx/d, ny = dy/d;
        const overlap = min - d;
        const em = e.mass, tot = em + bm;
        e.x -= nx*overlap*(bm/tot); e.y -= ny*overlap*(bm/tot);
        B.x += nx*overlap*(em/tot); B.y += ny*overlap*(em/tot);
        const rvx = e.vx-B.vx, rvy = e.vy-B.vy;
        const vn = rvx*nx + rvy*ny;
        if (vn < 0) {
          const imp = -(1.2)*vn/(1/em + 1/bm);
          e.vx -= nx*imp/em; e.vy -= ny*imp/em;
          B.vx += nx*imp/bm; B.vy += ny*imp/bm;
        }
      }
    }
  }

  // 5c) зв'язки (тільки els)
  bondPass(dt);
  reportBodies(dt);

  // 6) декор
  for (let i=W.parts.length-1;i>=0;i--) { const p=W.parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.t-=dt; if (p.t<=0) W.parts.splice(i,1); }
  for (let i=W.shocks.length-1;i>=0;i--) { const s=W.shocks[i]; s.r+=(s.max-s.r)*dt*6; s.t-=dt; if (s.t<=0) W.shocks.splice(i,1); }
  for (let i=W.links.length-1;i>=0;i--) { W.links[i].t-=dt; if (W.links[i].t<=0) W.links.splice(i,1); }
  for (let i=W.events.length-1;i>=0;i--) { W.events[i].t-=dt; if (W.events[i].t<=0) W.events.splice(i,1); }
}
function clampDrop(d) {
  if (d.x < d.r) d.x = d.r;
  if (d.x > W.W-d.r) d.x = W.W-d.r;
  if (d.y < d.r) d.y = d.r;
  if (d.y > W.H-d.r) d.y = W.H-d.r;
}
function clampEl(e) {
  if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx)*0.4; }
  if (e.x > W.W-e.r) { e.x = W.W-e.r; e.vx = -Math.abs(e.vx)*0.4; }
  if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy)*0.4; }
  if (e.y > W.H-e.r) { e.y = W.H-e.r; e.vy = -Math.abs(e.vy)*0.4; }
}
function clampBody() {
  const R = W.body.r * W.body.scale;
  if (W.body.x < R) { W.body.x = R; W.body.vx = Math.abs(W.body.vx)*0.4; }
  if (W.body.x > W.W-R) { W.body.x = W.W-R; W.body.vx = -Math.abs(W.body.vx)*0.4; }
  if (W.body.y < R) { W.body.y = R; W.body.vy = Math.abs(W.body.vy)*0.4; }
  if (W.body.y > W.H-R) { W.body.y = W.H-R; W.body.vy = -Math.abs(W.body.vy)*0.4; }
}
function bodyBurst() {
  const B = W.body;
  shock(B.x, B.y, CFG.BURST_R);
  spark(B.x, B.y, '#ef476f', 16);
  for (const o of W.els) {
    const d = Math.hypot(o.x-B.x, o.y-B.y);
    if (d < CFG.BURST_R && d > 0.1) {
      const f = CFG.BURST_F * (1 - d/CFG.BURST_R);
      o.vx += (o.x-B.x)/d * f / o.mass;
      o.vy += (o.y-B.y)/d * f / o.mass;
    }
  }
  B.energy = 0;
  event('ТІЛО РОЗПАЛОСЯ: вибух розкидав шматочки');
  link(B.x, B.y, B.x + 60, B.y, 'ВИБУХ');
  for (let i=2;i>=0;i--) ejectSlot(i);
  updateBody();
}
function tryBond(a, b, lim) {
  if (a === b) return;
  if (a.bonds.some(x=>x.o===b)) return;
  if (a.bonds.length >= 6 || b.bonds.length >= 6) return;
  if (Math.hypot(b.x-a.x, b.y-a.y) > lim) return;
  const rest = (a.r + b.r) * 0.82;
  a.bonds.push({ o:b, rest });
  b.bonds.push({ o:a, rest });
  spark((a.x+b.x)/2, (a.y+b.y)/2, '#4cc9f0', 8);
  evThrottle('bond'+Math.min(a.id,b.id), a.ty.name + ' — ' + b.ty.name + ': З\'ЄДНАНО', 1.2);
}
function breakBond(a, bd, cause) {
  const o = bd.o;
  a.bonds = a.bonds.filter(x=>x!==bd);
  o.bonds = o.bonds.filter(x=>x.o!==a);
  spark((a.x+o.x)/2, (a.y+o.y)/2, '#ef476f', 8);
  evThrottle('brk'+Math.min(a.id,o.id), 'РОЗРИВ: ' + cause + ' розірвав ' + a.ty.name + ' — ' + o.ty.name, 1.2);
  const dx = o.x-a.x, dy = o.y-a.y, d = Math.hypot(dx,dy) || 1;
  a.vx -= dx/d*40; a.vy -= dy/d*40;
  o.vx += dx/d*40; o.vy += dy/d*40;
}
function bondPass(dt) {
  for (let iter=0; iter<2; iter++) {
    for (const e of W.els) {
      for (let bi=e.bonds.length-1; bi>=0; bi--) {
        const bd = e.bonds[bi];
        const o = bd.o;
        if (!o || !o.bonds.some(x=>x.o===e)) { e.bonds.splice(bi,1); continue; }
        const dx = o.x-e.x, dy = o.y-e.y;
        const d = Math.hypot(dx,dy) || 1;
        const diff = d - bd.rest;
        if (diff > bd.rest*CFG.BOND_BREAK_STRETCH || d > (e.r+o.r)*3) { breakBond(e, bd, 'розтяг'); continue; }
        const nx = dx/d, ny = dy/d;
        const rv = (o.vx-e.vx)*nx + (o.vy-e.vy)*ny;
        if (Math.abs(rv) > CFG.BOND_BREAK_V) { breakBond(e, bd, 'удар'); continue; }
        const ma = e.mass, mb = o.mass, tot = ma+mb;
        const corr = diff * 0.35;
        e.x += nx*corr*(mb/tot); e.y += ny*corr*(mb/tot);
        o.x -= nx*corr*(ma/tot); o.y -= ny*corr*(ma/tot);
        const damp = rv * 0.10;
        e.vx += nx*damp; e.vy += ny*damp;
        o.vx -= nx*damp; o.vy -= ny*damp;
      }
    }

}
function components() {
  const seen = new Set(), comps = [];
  for (const e of W.els) {
    if (seen.has(e.id)) continue;
    const stack = [e], comp = [];
    seen.add(e.id);
    while (stack.length) {
      const c = stack.pop();
      comp.push(c);
      for (const bd of c.bonds) if (!seen.has(bd.o.id)) { seen.add(bd.o.id); stack.push(bd.o); }
    }
    comps.push(comp);
  }
  return comps;
}
function reportBodies(dt) {
  W._bt = (W._bt||0) - dt;
  if (W._bt > 0) return;
  W._bt = 1.2;
  const comps = components();
  const now = {};
  for (const c of comps) if (c.length >= 2) now[Math.min(...c.map(x=>x.id))] = c.length;
  const prev = W._bodies || {};
  for (const k in now) {
    if (prev[k] !== now[k]) {
      if (now[k] >= 3 && (!prev[k] || prev[k] < 3)) event('ТІЛО (природне): ' + now[k] + ' елементи тримаються разом');
    }
  }
  for (const k in prev) {
    if (!now[k] && prev[k] >= 3) event('ПРИРОДНЕ ТІЛО РОЗПАЛОСЯ');
  }
  W._bodies = now;
}
function burst(b) {
  shock(b.x, b.y, CFG.BURST_R);
  spark(b.x, b.y, '#ef476f', 14);
  for (const o of W.els) {
    if (o === b) continue;
    const d = Math.hypot(o.x-b.x, o.y-b.y);
    if (d < CFG.BURST_R && d > 0.1) {
      const f = CFG.BURST_F * (1 - d/CFG.BURST_R);
      o.vx += (o.x-b.x)/d * f / o.mass;
      o.vy += (o.y-b.y)/d * f / o.mass;
    }
  }
  b.energy = 0;
  event('ВИБУХ: ' + b.ty.name + ' розкидав силу навколо');
  link(b.x, b.y, b.x + 60, b.y, 'ВИБУХ');
  b.vx += (Math.random()-0.5)*60; b.vy += (Math.random()-0.5)*60;
  for (const o of W.els) {
    if (o === b) continue;
    const d = Math.hypot(o.x-b.x, o.y-b.y);
    if (d < CFG.BURST_R * 1.2) {
      for (let bi=o.bonds.length-1; bi>=0; bi--) {
        const bd = o.bonds[bi];
        if (Math.hypot(bd.o.x-b.x, bd.o.y-b.y) < CFG.BURST_R * 1.4 || bd.o === b) breakBond(o, bd, 'вибух');
      }
    }
  }
  for (let bi=b.bonds.length-1; bi>=0; bi--) breakBond(b, b.bonds[bi], 'вибух');
}

// ---------------- рендер ----------------
function draw() {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(vw*dpr) || cv.height !== Math.round(vh*dpr)) { cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr); }
  cam.z = Math.max(0.25, Math.min(3.2, cam.z || fitZoom()));
  // той самий clamp, що й clampCam: світ менший за екран → камера плаває в полях
  if (vw/cam.z >= W.W) {
    const span = vw/cam.z - W.W;
    cam.x = Math.max(-span, Math.min(0, cam.x));
  } else {
    cam.x = Math.max(0, Math.min(W.W - vw/cam.z, cam.x));
  }
  if (vh/cam.z >= W.H) {
    const span = vh/cam.z - W.H;
    cam.y = Math.max(-span, Math.min(0, cam.y));
  } else {
    cam.y = Math.max(0, Math.min(W.H - vh/cam.z, cam.y));
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(dpr*cam.z, 0, 0, dpr*cam.z, -cam.x*dpr*cam.z, -cam.y*dpr*cam.z);

  // підлога
  ctx.fillStyle = '#10141f';
  ctx.fillRect(0, 0, W.W, W.H);
  ctx.strokeStyle = 'rgba(60,80,120,0.10)';
  ctx.lineWidth = 1;
  for (let x=0; x<W.W; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,W.H); ctx.stroke(); }
  for (let y=0; y<W.H; y+=60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W.W,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(76,201,240,0.25)';
  ctx.lineWidth = 3;
  ctx.strokeRect(3, 3, W.W-6, W.H-6);

  // поля
  if (W.layers.fields) {
    for (const e of W.els) for (const p of e.ty.props) if (p.k==='emit_field') {
      ctx.strokeStyle = FCOL[p.f] + '55';
      ctx.lineWidth = 2;
      ctx.setLineDash([8,8]);
      ctx.beginPath(); ctx.arc(e.x, e.y, CFG.FIELD_R, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = FCOL[p.f] + 'aa';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('ПОЛЕ №' + p.f, e.x, e.y - CFG.FIELD_R - 8);
    }
    if (W.body.active) for (const p of bodyProps()) if (p.k==='emit_field') {
      ctx.strokeStyle = FCOL[p.f] + '77';
      ctx.lineWidth = 3;
      ctx.setLineDash([8,8]);
      ctx.beginPath(); ctx.arc(W.body.x, W.body.y, CFG.FIELD_R, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // каузальність
  for (const lk of W.links) {
    const a = Math.min(1, lk.t);
    ctx.strokeStyle = 'rgba(255,196,0,' + (0.7*a) + ')';
    ctx.lineWidth = 3;
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(lk.x1, lk.y1); ctx.lineTo(lk.x2, lk.y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,196,0,' + (0.9*a) + ')';
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(lk.label, (lk.x1+lk.x2)/2, (lk.y1+lk.y2)/2 - 8);
  }

  // зв'язки els
  for (const e of W.els) {
    for (const bd of e.bonds) {
      if (bd.o.id < e.id) continue;
      const dx = bd.o.x-e.x, dy = bd.o.y-e.y;
      const d = Math.hypot(dx,dy) || 1;
      const tension = Math.max(0, d - bd.rest)/bd.rest;
      ctx.strokeStyle = tension > 0.6 ? 'rgba(239,71,111,0.9)' : 'rgba(76,201,240,' + (0.35 + Math.min(0.5, tension)) + ')';
      ctx.lineWidth = 3 + tension*4;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(bd.o.x, bd.o.y); ctx.stroke();
    }
  }

  // краплі
  for (const d of W.drops) {
    ctx.globalAlpha = Math.min(1, d.t);
    ctx.fillStyle = FCOL[d.res];
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    ctx.fillStyle = FCOL[d.res] + '44';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r+5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // уламки (неактивні шматочки)
  for (const f of W.frags) {
    if (dragEl && dragEl.kind==='frag' && dragEl.obj===f) continue;
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = f.color;
    polyPath(ctx, f.x, f.y, f.r, f.pts, f.rot);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (cam.z > 0.5) {
      ctx.fillStyle = 'rgba(255,214,10,0.9)';
      ctx.font = 'bold ' + Math.max(8.5, 10*cam.z) + 'px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(f.role, f.x, f.y + f.r + 13);
    }
  }

  // елементи
  for (const e of W.els) {
    if (dragEl && dragEl.kind==='el' && dragEl.obj===e) continue;
    drawElem(ctx, e);
  }
  if (dragEl) {
    if (dragEl.kind==='el') { ctx.globalAlpha = 0.85; drawElem(ctx, dragEl.obj); ctx.globalAlpha = 1; }
    if (dragEl.kind==='frag') {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = dragEl.obj.color;
      polyPath(ctx, dragEl.obj.x, dragEl.obj.y, dragEl.obj.r, dragEl.obj.pts, dragEl.obj.rot);
      ctx.fill();
      ctx.globalAlpha = 1;
      // підсвітка цільового слота
      const slot = nearestSlot(dragEl.obj.x, dragEl.obj.y);
      if (slot >= 0) {
        const s = bodySlotXY(slot);
        ctx.strokeStyle = 'rgba(76,201,240,0.9)';
        ctx.lineWidth = 3;
        ctx.setLineDash([5,5]);
        ctx.beginPath(); ctx.arc(s.x, s.y, 20, 0, 7); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    if (dragEl.kind==='body') {
      ctx.globalAlpha = 0.85;
      drawBody(ctx, dragEl.obj);
      ctx.globalAlpha = 1;
    }
  }

  // ТІЛО
  drawBody(ctx, W.body);

  // hover
  if (W.hover) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    if (W.hover.kind==='el') ctx.beginPath(), ctx.arc(W.hover.obj.x, W.hover.obj.y, W.hover.obj.r + 12, 0, 7), ctx.stroke();
    else if (W.hover.kind==='frag') ctx.beginPath(), ctx.arc(W.hover.obj.x, W.hover.obj.y, W.hover.obj.r + 8, 0, 7), ctx.stroke();
    else if (W.hover.kind==='body') ctx.beginPath(), ctx.arc(W.hover.obj.x, W.hover.obj.y, W.hover.obj.r*W.hover.obj.scale + 12, 0, 7), ctx.stroke();
    ctx.setLineDash([]);
  }

  // частинки та хвилі
  for (const p of W.parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.t));
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const s of W.shocks) {
    ctx.strokeStyle = 'rgba(255,255,255,' + Math.max(0, s.t*1.2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.stroke();
  }
}
function drawElem(ctx, e) {
  const t = e.ty;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.arc(e.x + 3, e.y + 4, e.r, 0, 7); ctx.fill();
  ctx.fillStyle = t.color;
  polyPath(ctx, e.x, e.y, e.r, t.pts, e.rot||0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1.5;
  polyPath(ctx, e.x, e.y, e.r, t.pts, e.rot||0);
  ctx.stroke();
  // заряд
  if (e.energy > 2) {
    const bp = t.props.find(p=>p.k==='burst');
    const thr = bp ? bp.thr : 80;
    ctx.strokeStyle = 'rgba(239,71,111,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r+5, 0, Math.PI*2*Math.min(1, e.energy/thr)); ctx.stroke();
  }
  // індикатор реакції на поле
  for (const p of t.props) if (p.k==='react_field') {
    ctx.strokeStyle = FCOL[p.f] + 'aa';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r+9, 0, 7); ctx.stroke();
  }
  if (cam.z > 0.55) {
    ctx.fillStyle = 'rgba(223,230,242,0.75)';
    ctx.font = 'bold ' + Math.max(10, 12*cam.z) + 'px system-ui';
    ctx.textAlign = 'center';

  }
}
function drawBody(ctx, B) {
  const sc = B.scale;
  // каркас: полігон через слоти (розширений)
  const pts = BODY_SLOTS.map(s => [s[0]*sc, s[1]*sc]);
  if (B.active) {
    const col = (B.slots[0]||{}).color || '#4cc9f0';
    ctx.fillStyle = col + '33';
    polyPath(ctx, B.x, B.y, 1, pts, 0);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    polyPath(ctx, B.x, B.y, 1, pts, 0);
    ctx.stroke();
    // кільце-індикатор активності
    ctx.strokeStyle = 'rgba(110,231,160,0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.arc(B.x, B.y, 30*sc + 8 + Math.sin(W.t*3)*3, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    // заряд
    if (B.energy > 2) {
      const bp = bodyProps().find(p=>p.k==='burst');
      const thr = bp ? bp.thr : 80;
      ctx.strokeStyle = 'rgba(239,71,111,0.85)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(B.x, B.y, 30*sc + 14, 0, Math.PI*2*Math.min(1, B.energy/thr)); ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(110,167,199,0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    polyPath(ctx, B.x, B.y, 1, pts, 0);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // слоти
  for (let i=0;i<3;i++) {
    const s = bodySlotXY(i);
    const fr = B.slots[i];
    if (fr) {
      ctx.fillStyle = fr.color;
      polyPath(ctx, s.x, s.y, 13, fr.pts, fr.rot);
      ctx.fill();
    } else {
      ctx.strokeStyle = B.active ? 'rgba(110,231,160,0.8)' : 'rgba(110,167,199,0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(s.x, s.y, 13, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // підпис
  const filled = B.slots.filter(Boolean).length;
  ctx.fillStyle = B.active ? '#6ee7a0' : 'rgba(155,180,210,0.85)';
  ctx.font = 'bold ' + Math.max(10, 12*cam.z) + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(B.active ? 'ТІЛО АКТИВНЕ' : 'ТІЛО · ' + filled + '/3', B.x, B.y + 52*sc + 6);
}

// ---------------- лог ----------------
function renderLog() {
  logTimer -= 16;
  if (logTimer > 0) return;
  logTimer = 400;
  const el = document.getElementById('log');
  el.innerHTML = '';
  const n = Math.min(6, W.events.length);
  for (let i=0;i<n;i++) {
    const d = document.createElement('div');
    d.className = 'lge';
    d.textContent = W.events[i].text;
    el.appendChild(d);
  }
  if (hintTimer > 0) {
    hintTimer -= 0.4;
    if (hintTimer <= 0) document.getElementById('hint').style.display = 'none';
  }
}

// ---------------- ввід ----------------
function nearestSlot(wx, wy) {
  let best = -1, bd = 30;
  for (let i=0;i<3;i++) {
    if (W.body.slots[i]) continue;
    const s = bodySlotXY(i);
    const d = Math.hypot(s.x-wx, s.y-wy);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function hit(wx, wy) {
  // спершу уламки (маленькі), потім елементи, потім тіло
  let best=null, bd=1e9;
  for (const f of W.frags) {
    const d = Math.hypot(f.x-wx, f.y-wy);
    if (d < f.r + 8 && d < bd) { bd = d; best = { kind:'frag', obj:f }; }
  }
  for (const e of W.els) {
    const d = Math.hypot(e.x-wx, e.y-wy);
    const lim = e.r + 6 + (e.ty.grip-1)*10;
    if (d < lim && d < bd) { bd = d; best = { kind:'el', obj:e }; }
  }
  const B = W.body;
  if (Math.hypot(B.x-wx, B.y-wy) < B.r*B.scale + 14 && Math.hypot(B.x-wx, B.y-wy) < bd) {
    best = { kind:'body', obj:B };
  }
  return best;
}
function zoomAt(cx, cy, dy) {
  const cv = document.getElementById('cv');
  const rect = cv.getBoundingClientRect();
  const mx = cx - rect.left, my = cy - rect.top;
  // безпечний крок: не більше ×2 за подію (захист від дивних драйверів)
  const f = Math.max(0.5, Math.min(2, Math.exp(-dy * 0.002)));
  const z2 = Math.max(0.25, Math.min(3.2, cam.z * f));
  cam.x += mx/cam.z - mx/z2;
  cam.y += my/cam.z - my/z2;
  cam.z = z2;
  if (window.__clampCam) window.__clampCam();
}
function bindInput() {
  const cv = document.getElementById('cv');
  const ptrs = {};
  const TH = 7;
  const toWorld = (cx, cy) => {
    const r = cv.getBoundingClientRect();
    return { x: cam.x + (cx - r.left)/cam.z, y: cam.y + (cy - r.top)/cam.z };
  };
  const setPos = (id, x, y) => {
    const p = ptrs[id]; if (!p) return;
    p.px = p.x; p.py = p.y; p.x = x; p.y = y;
    if (!p.moved && Math.hypot(x-p.sx, y-p.sy) > TH) p.moved = true;
  };
  const grabAt = (p) => {
    // захоплення за СТАРТОВОЮ точкою натискання (не за поточною — інакше малі уламки губляться за перший крок руху)
    const w = toWorld(p.sx, p.sy);
    const h = hit(w.x, w.y);
    if (h) {
      dragEl = h;
      if (h.kind === 'el') { dragEl.dx = h.obj.x - w.x; dragEl.dy = h.obj.y - w.y; h.obj._dvx = 0; h.obj._dvy = 0; }
      if (h.kind === 'frag') { dragEl.dx = h.obj.x - w.x; dragEl.dy = h.obj.y - w.y; }
      if (h.kind === 'body') { dragEl.dx = h.obj.x - w.x; dragEl.dy = h.obj.y - w.y; }
      ilog('grab ' + h.kind + ' ' + (h.kind==='el' ? h.obj.ty.name : (h.kind==='frag' ? h.obj.role : 'ТІЛО')));
      return true;
    }
    return false;
  };
  const grab = (p) => { return grabAt(p); };
  const pinchStart = () => {
    const ids = Object.keys(ptrs);
    if (ids.length !== 2) return;
    if (dragEl) { dragEl = null; }
    // пальці вже рухались (пінч) — щоб після підняття одного, другий одразу панорамував
    for (const id of ids) ptrs[id].moved = true;
    const r = cv.getBoundingClientRect();
    const a = ptrs[ids[0]], b = ptrs[ids[1]];
    pinch = {
      d: Math.max(8, Math.hypot(a.x-b.x, a.y-b.y)),
      z0: cam.z, cx0: cam.x, cy0: cam.y,
      mx: (a.x+b.x)/2 - r.left, my: (a.y+b.y)/2 - r.top,
    };
    ilog('pinch↓ d=' + Math.round(pinch.d) + ' z0=' + Math.round(pinch.z0*100)/100, 'ilc');
  };
  const pinchUpdate = () => {
    if (!pinch) return;
    const ids = Object.keys(ptrs);
    if (ids.length !== 2) return;
    const a = ptrs[ids[0]], b = ptrs[ids[1]];
    const d = Math.max(8, Math.hypot(a.x-b.x, a.y-b.y));
    const z = Math.max(0.25, Math.min(3.2, pinch.z0 * d / pinch.d));
    cam.z = z;
    const wmx = pinch.cx0 + pinch.mx / pinch.z0;
    const wmy = pinch.cy0 + pinch.my / pinch.z0;
    cam.x = wmx - pinch.mx / z;
    cam.y = wmy - pinch.my / z;
    if (window.__clampCam) window.__clampCam();
    const now = Date.now();
    if (!window.__ilPinch || now - window.__ilPinch > 150) {
      window.__ilPinch = now;
      ilog('pinch→ d=' + Math.round(d) + ' z=' + Math.round(z*100)/100 + ' ' + fmtCam(), 'ilc');
    }
  };
  const move = (id, x, y) => {
    const p = ptrs[id]; if (!p) return;
    setPos(id, x, y);
    if (Object.keys(ptrs).length === 2) {
      if (!pinch) pinchStart();
      pinchUpdate();
      return;
    }
    if (!p.moved) return;
    if (p.longT) { clearTimeout(p.longT); p.longT = null; }
    if (dragEl) {
      const w = toWorld(x, y);
      const o = dragEl.obj;
      const nx = w.x + dragEl.dx, ny = w.y + dragEl.dy;
      if (dragEl.kind === 'el') {
        o._dvx = (nx - o.x) * 60; o._dvy = (ny - o.y) * 60;
        o.x = nx; o.y = ny; o.vx = 0; o.vy = 0;
        clampEl(o);
      } else if (dragEl.kind === 'frag') {
        o.x = nx; o.y = ny;
      } else {
        o.x = nx; o.y = ny; o.vx = 0; o.vy = 0;
        clampBody();
      }
    } else {
      if (p.onEl && !p.tried) { p.tried = true; if (!grab(p)) p.onEl = false; }
      if (dragEl) return;
      cam.x -= (p.x - p.px) / cam.z;
      cam.y -= (p.y - p.py) / cam.z;
      if (window.__clampCam) window.__clampCam();
    }
  };
  const release = (id) => {
    const p = ptrs[id]; delete ptrs[id];
    if (Object.keys(ptrs).length < 2) pinch = null;
    if (p && p.longT) { clearTimeout(p.longT); p.longT = null; }
    // тап без зсуву: спершу слоти тіла (незалежно від того, що захоплено — els може перекривати слот)
    if (p && !p.moved) {
      const w = toWorld(p.x, p.y);
      for (let i=0;i<3;i++) {
        const s = bodySlotXY(i);
        if (Math.hypot(s.x-w.x, s.y-w.y) < 26 && W.body.slots[i]) { ejectSlot(i); break; }
      }
      dragEl = null;
      return;
    }
    if (dragEl && p) {
      if (dragEl.kind === 'frag') {
        // вставити в слот тіла, якщо відпустили над ним
        const slot = nearestSlot(dragEl.obj.x, dragEl.obj.y);
        if (slot >= 0) {
          insertFrag(dragEl.obj, slot);
          dragEl = null;
          return;
        }
      }
      if (dragEl.kind === 'el') {
        dragEl.obj.vx = Math.max(-520, Math.min(520, dragEl.obj._dvx||0));
        dragEl.obj.vy = Math.max(-520, Math.min(520, dragEl.obj._dvy||0));
        // злипання при відпусканні поруч (link)
        if (dragEl.obj.ty.props.some(p=>p.k==='link')) {
          let target=null, bd2=1e9;
          for (const e of W.els) {
            if (e===dragEl.obj) continue;
            const d = Math.hypot(e.x-dragEl.obj.x, e.y-dragEl.obj.y);
            const lim = (e.r + dragEl.obj.r) * CFG.SNAP * dragEl.obj.ty.grip;
            if (d < lim && d < bd2) { bd2 = d; target = e; }
          }
          if (target) tryBond(dragEl.obj, target, (dragEl.obj.r + target.r) * CFG.SNAP * dragEl.obj.ty.grip);
        }
      }
      dragEl = null;
      return;
    }
  };
  const longPress = (p) => {
    const w = toWorld(p.x, p.y);
    const h = hit(w.x, w.y);
    if (!h) return;
    if (h.kind === 'el') dismantle(h.obj);
    else if (h.kind === 'body') { ejectAllBody(); }
  };
  // тач
  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const w = toWorld(t.clientX, t.clientY);
      const h = hit(w.x, w.y);
      const p = { x:t.clientX, y:t.clientY, sx:t.clientX, sy:t.clientY, px:t.clientX, py:t.clientY, moved:false, onEl:!!h, tried:false, longT:null };
      p.longT = setTimeout(()=>{ if (ptrs[t.identifier]) longPress(p); }, 450);
      ptrs[t.identifier] = p;
      ilog('touch↓ id=' + t.identifier + ' (' + Math.round(t.clientX) + ',' + Math.round(t.clientY) + ') hit=' + (h?h.kind:'—'));
    }
    if (Object.keys(ptrs).length === 2) pinchStart();
  }, {passive:false});
  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const id = t.identifier, x = Math.round(t.clientX), y = Math.round(t.clientY);
      move(id, t.clientX, t.clientY);
      // лог не частіше ніж раз на 200ms (інакше спам)
      const now = Date.now();
      if (!window.__ilLast || now - window.__ilLast > 200) {
        window.__ilLast = now;
        ilog('touch→ id=' + id + ' (' + x + ',' + y + ') ' + (dragEl ? ('drag=' + dragEl.kind + ' ' + (dragEl.obj.ty?dragEl.obj.ty.name:(dragEl.obj.role||'ТІЛО'))) : (Object.keys(ptrs).length===2 ? 'pinch' : 'pan')) + ' ' + fmtCam());
      }
    }
  }, {passive:false});
  cv.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      const p = ptrs[t.identifier];
      ilog('touch↑ id=' + t.identifier + ' moved=' + (p && p.moved ? 1 : 0));
      release(t.identifier);
    }
  });
  // миша
  cv.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const w = toWorld(e.clientX, e.clientY);
    const h = hit(w.x, w.y);
    ilog('mouse↓ (' + Math.round(e.clientX) + ',' + Math.round(e.clientY) + ') hit=' + (h?h.kind:'—'));
    const p = { x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, px:e.clientX, py:e.clientY, moved:false, onEl:!!h, tried:false, longT:null };
    p.longT = setTimeout(()=>{ if (ptrs[0]) longPress(p); }, 450);
    ptrs[0] = p;
  });
  window.addEventListener('mousemove', e => { if (ptrs[0]) move(0, e.clientX, e.clientY); });
  window.addEventListener('mouseup', e => { if (ptrs[0]) release(0); });
  // колесо
  const clampCam = () => {
    const vw = window.innerWidth, vh = window.innerHeight;
    const cz = cam.z;
    // КЛЮЧ: коли світ МЕНШИЙ за екран — не центруємо жорстко, а дозволяємо
    // камері плавати в межах полів (панорама жива навіть після віддалення)
    if (vw/cz >= W.W) {
      const span = vw/cz - W.W;                 // поле в world-координатах
      cam.x = Math.max(-span, Math.min(0, cam.x)); // від "світ зліва" до "світ справа"
    } else {
      cam.x = Math.max(0, Math.min(W.W - vw/cz, cam.x));
    }
    if (vh/cz >= W.H) {
      const span = vh/cz - W.H;
      cam.y = Math.max(-span, Math.min(0, cam.y));
    } else {
      cam.y = Math.max(0, Math.min(W.H - vh/cz, cam.y));
    }
  };
  window.__clampCam = clampCam;
  window.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey) {
      // тачпад-щипок: браузери шлють сирі дрібні значення — зум без масштабування режимів
      zoomAt(e.clientX, e.clientY, e.deltaY * 30);
      ilog('ЗУМ щипок: raw dy=' + e.deltaY + ' m=' + e.deltaMode + ' → ' + fmtCam(), 'ilc');
      return;
    }
    let dy = e.deltaY, dx = e.deltaX;
    if (e.deltaMode === 1) { dy *= 16; dx *= 16; }        // рядки — нормалізуємо ОБИДВІ осі
    else if (e.deltaMode === 2) { dy *= 120; dx *= 120; } // сторінки
    // тачпад-скрол (дрібні значення) = панорама по X та Y; колесо миші (великі кроки) = зум
    if (Math.abs(dy) <= 35) {
      cam.x += dx / cam.z;
      cam.y += dy / cam.z;
      clampCam();
      ilog('ПАНОРАМА: dx=' + Math.round(dx) + ' dy=' + Math.round(dy) + ' m=' + e.deltaMode + ' → ' + fmtCam());
      return;
    }
    zoomAt(e.clientX, e.clientY, dy);
    ilog('ЗУМ колесо: dy=' + Math.round(dy) + ' m=' + e.deltaMode + ' → ' + fmtCam(), 'ilc');
  }, {passive:false});
  // hover
  cv.addEventListener('mousemove', e => {
    if (ptrs[0]) return;
    const w = toWorld(e.clientX, e.clientY);
    const h = hit(w.x, w.y);
    W.hover = h;
    cv.style.cursor = h ? 'grab' : 'default';
  });
  cv.addEventListener('mouseleave', () => { W.hover = null; cv.style.cursor = 'default'; });
  // мобільний адресний бар/орієнтація: поки гравець не втрутився (перші секунди) — перерахувати камеру під новий в'юпорт
  window.addEventListener('resize', () => {
    if (!W || W.t > 3) return;
    const d = worldDims();
    if (d.W !== W.W || d.H !== W.H) {
      // світ згенерувався під малий в'юпорт (адрес-бар) — перегенерувати той самий seed під новий розмір
      ilog('resize ' + window.innerWidth + 'x' + window.innerHeight + ' → ПЕРЕГЕНЕРАЦІЯ світу (був ' + W.W + 'x' + W.H + ')', 'ile');
      newWorld(W.seed);
      refreshSeed();
      return;
    }
    cam.z = fitZoom();
    centerCam();
    if (window.__clampCam) window.__clampCam();
    ilog('resize ' + window.innerWidth + 'x' + window.innerHeight + ' → камера ' + fmtCam());
  });
}

function bindButtons() {
  const $ = id => document.getElementById(id);
  const setMode = m => { W.mode = m; $('bPlay').classList.toggle('on', m==='play'); $('bSlow').classList.toggle('on', m==='slow'); $('bPause').classList.toggle('pause', m==='pause'); };
  $('bPlay').onclick = ()=>setMode('play');
  $('bSlow').onclick = ()=>setMode(W.mode==='slow' ? 'play' : 'slow');
  $('bPause').onclick = ()=>setMode(W.mode==='pause' ? 'play' : 'pause');
  $('bFields').onclick = ()=>{ W.layers.fields = !W.layers.fields; $('bFields').classList.toggle('on', W.layers.fields); };
  $('bForces').onclick = ()=>{ W.layers.forces = !W.layers.forces; $('bForces').classList.toggle('on', W.layers.forces); };
  $('bDrops').onclick = ()=>{ W.layers.drops = !W.layers.drops; $('bDrops').classList.toggle('on', W.layers.drops); };
  $('bTypes').onclick = ()=>{ document.getElementById('types').classList.toggle('open'); };
  $('bLog').onclick = ()=>{ document.getElementById('inlog').classList.toggle('open'); renderInLog(); };
  $('bFit').onclick = ()=>{ cam.z = fitZoom(); cam.x = 0; cam.y = 0; if (window.__clampCam) window.__clampCam(); };
  $('bNew').onclick = ()=>{ newWorld((Math.random()*1e9)|0); refreshSeed(); };
}
function refreshSeed() {
  document.getElementById('tseed').textContent = 'seed ' + W.seed;
}

// ---------------- головний цикл ----------------
let lastT = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastT)/1000 || 0.016);
  lastT = ts;
  if (W) step(dt);
  if (W) draw();
  if (W) renderLog();
  renderInLog();
  requestAnimationFrame(loop);
}

// ---------------- dev-хуки ----------------
window.__G = {
  state(){
    const comps = W && W.els ? components() : [];
    return {
      seed: W.seed, t: Math.round(W.t*10)/10, mode: W.mode,
      types: W.types.map(t=>({ name:t.name, color:t.color, shape:t.pts.length, props:t.props.map(propText) })),
      els: W.els.length, frags: W.frags.map(f=>({ role:f.role, props:f.props.map(propText) })),
      drops: W.drops.length, events: W.events.slice(0,5).map(e=>e.text),
      bonds: W.els.reduce((m,e)=>m+e.bonds.length,0)/2,
      bodies: comps.filter(c=>c.length>=2).map(c=>c.length).sort((a,b)=>b-a),
      moved: W.els.reduce((m,e)=>Math.max(m, Math.hypot(e.vx,e.vy)), 0),
      body: {
        x: Math.round(W.body.x), y: Math.round(W.body.y),
        active: W.body.active, energy: Math.round(W.body.energy*10)/10,
        slots: W.body.slots.map(s=>s?{role:s.role, props:s.props.map(propText)}:null),
        vx: Math.round(W.body.vx), vy: Math.round(W.body.vy),
      },
    };
  },
  insertFrag(fi, slot){ const fr = W.frags[fi]; if (fr) insertFrag(fr, slot); return this.state(); },
  eject(slot){ ejectSlot(slot); return this.state(); },
  ejectAll(){ ejectAllBody(); return this.state(); },
  dismantle(i){ if (i < W.els.length) dismantle(W.els[i]); return this.state(); },
  bondPair(i,j){
    if (i<W.els.length && j<W.els.length) tryBond(W.els[i], W.els[j], (W.els[i].r+W.els[j].r)*CFG.SNAP*W.els[i].ty.grip);
    return this.state();
  },
  newWorld(seed){ newWorld(seed); refreshSeed(); return this.state(); },
  fast(sec){ const n = Math.ceil(sec/0.016); for (let i=0;i<n;i++) step(0.016); return this.state(); },
  setMode(m){ W.mode = m; document.getElementById('bPlay').classList.toggle('on', m==='play'); document.getElementById('bSlow').classList.toggle('on', m==='slow'); document.getElementById('bPause').classList.toggle('pause', m==='pause'); },
  dragTo(i, x, y, holdSec){
    const e = W.els[i];
    e.x = x; e.y = y; e.vx = 0; e.vy = 0;
    const n = Math.ceil((holdSec||1)/0.016);
    for (let k=0;k<n;k++) step(0.016);
    return this.state();
  },
  // бот: намічене рішення — зібрати тіло з 3 уламків і перевірити, що воно ожило
  bot(){
    const pick = pred => W.frags.findIndex(f => f.props.some(p => pred(p)));
    // 1) реактор ВІДШТОВХ/ПРИТЯГ (рух), 2) емітер поля, 3) будь-що
    let a = pick(p => p.k==='react_field' && (p.eff==='repel'||p.eff==='attract'));
    if (a < 0) a = 0;
    let b = pick(p => p.k==='emit_field');
    if (b < 0 || b === a) b = (a+1) % W.frags.length;
    let c = (a!==0 && b!==0) ? 0 : ((a!==1 && b!==1) ? 1 : 2);
    if (c === a || c === b) c = (c+1) % W.frags.length;
    const names = [a,b,c].map(i=>W.frags[i].role);
    this.insertFrag(a, 0); this.insertFrag(b, 1); this.insertFrag(c, 2);
    const active = W.body.active;
    const st0 = { x: W.body.x, y: W.body.y, vx: W.body.vx, vy: W.body.vy };
    this.fast(3);
    const moved = Math.hypot(W.body.x-st0.x, W.body.y-st0.y) + Math.hypot(W.body.vx-st0.vx, W.body.vy-st0.vy);
    return { ok: active && moved > 1, active, moved: Math.round(moved*10)/10, frags: names, body: this.state().body };
  },
};

// ---------------- старт ----------------
bindInput();
bindButtons();
newWorld((Math.random()*1e9)|0);
refreshSeed();
requestAnimationFrame(loop);
</script>
